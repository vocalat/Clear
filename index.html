lid var(--line)}.source:last-child{border-bottom:0}.source small{font-family:ui-monospace,monospace;color:var(--muted)}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}textarea,input,select{width:100%;background:var(--surface);border:1px solid var(--line);padding:13px;border-radius:0}textarea{min-height:130px;resize:vertical}.research-grid{display:grid;gap:14px}dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(760px,100%);max-height:92dvh;margin:auto;border-radius:0;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.56)}.dialogbody{padding:22px;overflow:auto;max-height:92dvh}.dialogtop{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}.close{width:44px;height:44px;background:transparent;border:1px solid var(--line);font-size:1.4rem}.lessoncopy{max-width:65ch}.callout{border-left:4px solid var(--accent);padding:12px 14px;background:var(--paper2);margin:18px 0}.terms{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.termchip{border:1px solid var(--line);background:transparent;padding:8px 10px;min-height:44px}.lesson-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe-b));display:grid;grid-template-columns:repeat(4,1fr)}nav button{border:0;background:transparent;min-height:51px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.68rem;color:var(--muted)}nav button.active{color:var(--accent);font-weight:800}.notice{font-size:.86rem;color:var(--muted)}@media(min-width:700px){main{padding:38px 28px 50px}.modes{grid-template-columns:repeat(4,1fr)}.research-grid{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>const DATA={"lessons":[{"id":"connection","path":"Saraçhane","title":"Your connection to the teqe","minutes":8,"modes":["quick","travel"],"summary":"Begin by separating family memory, cultural belonging and formal tariqa membership.","body":"A family can be connected to a teqe in several ways: regular attendance, friendship and service, formal initiation, kinship with dervishes, or simply inherited respect. These are not identical. Your first task is not to assign yourself a rank, but to document what your relatives actually remember and what can later be confirmed.","terms":["myhyb","dervish","bay‘a"],"activity":"Write the names of three relatives who may know your family’s history with Saraçhane.","reflection":"What do you know from direct memory, and what have you only heard second-hand?","sources":["S1"]},{"id":"tasawwuf","path":"Tasawwuf","title":"What tasawwuf studies","minutes":10,"modes":["quick","travel"],"summary":"Tasawwuf concerns spiritual discipline, character and awareness of God within Islam.","body":"Tasawwuf is a broad historical tradition of spiritual education within Islam. Its literature discusses sincerity, repentance, remembrance, control of the ego, love, trust, companionship and disciplined conduct. A tariqa is a more specific organised path with its own lineage, methods and community. Not every Sufi author belonged to the same tariqa, and not every tariqa teaches identical practices.","terms":["tasawwuf","tariqa","adab"],"activity":"Explain the difference between tasawwuf and tariqa in two sentences.","reflection":"Which part interests you most: history, character, practice, or family heritage?","sources":["S7","S8"]},{"id":"tariqa","path":"Tasawwuf","title":"Tariqa, silsila and authorisation","minutes":14,"modes":["travel","focus"],"summary":"A tariqa is not only a set of ideas; it is also a chain of teachers and authorised transmission.","body":"Silsila means a chain of spiritual transmission. In organised Sufi orders, a teacher’s authority is normally connected to prior teachers. Titles such as sheikh and halife are therefore not merely compliments or automatic promotions. Their exact use varies by order and locality. Public family attachment does not itself establish formal authorisation.","terms":["silsila","halife","sheikh"],"activity":"Create a blank lineage page with columns for person, teacher, evidence and confidence.","reflection":"Why is a documented chain different from a list copied from an unsourced website?","sources":["S7","S9"]},{"id":"roles","path":"Saraçhane","title":"Myhyb, dervish, halife and sheikh","minutes":16,"modes":["travel","focus"],"summary":"These words describe different relationships, responsibilities and forms of authority—not a simple military ladder.","body":"A myhyb or muhib is generally someone attached through love, support or participation. A dervish is more formally committed to a spiritual path and community. A halife is an authorised representative in many tariqa settings, though the scope of authorisation can differ. A sheikh is an authorised spiritual guide and may lead a lodge. Local usage at Saraçhane should be confirmed directly because public sources do not fully document every internal distinction.","terms":["myhyb","dervish","halife","sheikh"],"activity":"Make a table: title, meaning, authority, how confirmed.","reflection":"Which titles indicate affection, and which imply formal authority?","sources":["S2","S6"]},{"id":"halvetiyye-origins","path":"Halvetiyye","title":"Origins of the Halvetiyye","minutes":18,"modes":["travel","focus"],"summary":"The Halvetiyye is associated with Ömer el-Halvetî and developed into one of the most widespread Sufi orders.","body":"The order is named after Ömer el-Halvetî, who died around 1397–98. Its chain connects through earlier teachers to the Zahidiyye milieu. Yahya-yı Şirvani is often regarded as a second founder because of his role in shaping and spreading the order. From Azerbaijan and Anatolia, Halveti networks expanded into the Balkans, Syria, Egypt, North Africa and elsewhere.","terms":["Ömer el-Halvetî","Yahya-yı Şirvani","halvet"],"activity":"Place Ömer el-Halvetî and Yahya-yı Şirvani on your lineage map.","reflection":"Why can an order have both an eponymous founder and a later ‘second founder’?","sources":["S7","S10"]},{"id":"halvet","path":"Halvetiyye","title":"What halvet means","minutes":12,"modes":["quick","travel"],"summary":"Halvet refers to seclusion for worship and spiritual discipline, but formal retreats require guidance.","body":"In Sufi history, halvet means withdrawing from ordinary distractions for disciplined worship and remembrance. It became especially important in the Halveti tradition. Historical descriptions should not be turned into self-guided instructions: a formal retreat can involve rules, supervision and responsibilities that an app cannot provide.","terms":["halvet","khalwa","seyr-u suluk"],"activity":"Write one sentence distinguishing ordinary quiet reflection from formal halvet.","reflection":"Why is historical knowledge not the same as permission to perform a practice?","sources":["S11"]},{"id":"branches","path":"Halvetiyye","title":"The four principal branches","minutes":15,"modes":["travel","focus"],"summary":"Halvetiyye developed into major branches, including Ahmediyye, from which Ramazaniyye emerged.","body":"Reference works commonly identify four main Halveti branches: Rûşeniyye, Cemâliyye, Ahmediyye and Şemsiyye. Saraçhane’s tradition is connected through Ahmediyye to Ramazaniyye. This means that practices observed in another Halveti branch should not automatically be assumed to match Saraçhane.","terms":["Ahmediyye","Ramazaniyye","branch"],"activity":"Draw: Halvetiyye → Ahmediyye → Ramazaniyye → Saraçhane.","reflection":"What mistakes happen when people treat every Halveti community as identical?","sources":["S7","S9"]},{"id":"ramazan-mahfi","path":"Ramazaniyye","title":"Ramazan Mahfi Efendi","minutes":15,"modes":["travel","focus"],"summary":"Ramazan Mahfi Efendi, who died in 1616, gave his name to the Ramazaniyye branch.","body":"Ramazan Efendi Mahfi was born in 1542 in Sandıklı and later taught in Istanbul. The Ramazaniyye developed within the Ahmediyye branch and continued through lodges in Istanbul, Bursa and later Balkan networks. His biography is important because Saraçhane’s self-understanding belongs to this branch rather than to Halvetiyye only in a general sense.","terms":["Ramazan Mahfi","Ramazaniyye","Ahmediyye"],"activity":"Add Ramazan Mahfi to your branch diagram with dates 1542–1616.","reflection":"Why does identifying the correct branch matter for local history?","sources":["S8","S9"]},{"id":"prizren-context","path":"Saraçhane","title":"Prizren as a Sufi centre","minutes":14,"modes":["travel","focus"],"summary":"Ottoman Prizren developed a dense religious and cultural landscape that included many dervish lodges.","body":"Prizren was an important Ottoman urban centre with mosques, medreses, baths and dervish lodges. Its multilingual character and preserved Ottoman architecture help explain why several tariqas established long-lived communities there. Saraçhane should therefore be studied as part of Prizren’s wider religious and social history, not as an isolated building.","terms":["Prizren","teqe","Ottoman Balkans"],"activity":"List three other religious or cultural institutions that shaped historic Prizren.","reflection":"How can a teqe be both a spiritual institution and part of urban history?","sources":["S12"]},{"id":"osman-baba","path":"Saraçhane","title":"Sheikh Osman Baba","minutes":20,"modes":["travel","focus"],"summary":"Saraçhane’s foundation is associated with Sheikh Osman Baba, whose biography combines documented history and local tradition.","body":"Kosovo’s heritage record connects the foundation of the Prizren Halveti teqe with Sheikh Osman Baba and describes him as coming from Vlesha near Peshkopi. Accounts say he studied in Serres and later served at the Kukli Bey mosque in Prizren. Some local narratives also include miracle stories; these should be marked as community tradition unless supported by historical evidence.","terms":["Osman Baba","Vlesha","Serres"],"activity":"Create two columns: documented biography and community tradition.","reflection":"How can you preserve a sacred family story without presenting it as verified history?","sources":["S1","S2"]},{"id":"foundation-dates","path":"Saraçhane","title":"Why the dates disagree","minutes":22,"modes":["focus","research"],"summary":"Sources give 1712, 1713 and other dates; the present complex is also associated with 1835.","body":"A strong research app should not hide conflicting dates. An academic-style overview gives 1712 for Osman Baba’s foundation. Other Prizren sources give 1713. Heritage and tourism descriptions associate the existing complex or rebuilding with 1835. These may refer to different events: establishment of the community, formal foundation, construction, rebuilding or later restoration. The correct next step is to compare source wording and ask the teqe what its own records describe.","terms":["foundation","construction","reconstruction"],"activity":"Make a date-comparison table with columns: date, source, exact claim, confidence.","reflection":"Which historical event might each date represent?","sources":["S1","S3","S5","S6"]},{"id":"asitane","path":"Saraçhane","title":"What ‘asitane’ means here","minutes":13,"modes":["quick","travel"],"summary":"Asitane usually indicates a principal or mother lodge, but its exact institutional meaning should be confirmed locally.","body":"In Ottoman Sufi usage, âsitâne can refer to a central or principal lodge associated with a branch or regional network. Saraçhane is publicly described as a mother or central lodge for Halveti-Ramazani communities in Kosovo and connected Albanian-speaking areas. The exact legal and spiritual scope of that status today requires confirmation from its authorised leadership.","terms":["asitane","dergah","mother lodge"],"activity":"Write three questions about what authority the Saraçhane asitane exercises today.","reflection":"Why can the meaning of an institutional title change over time?","sources":["S6","S13"]},{"id":"architecture","path":"Saraçhane","title":"Reading the complex","minutes":18,"modes":["travel","research"],"summary":"The teqe complex includes ritual, residential, funerary and communal spaces.","body":"Heritage descriptions place the teqe in Prizren’s historic Saraçhane quarter. Accounts describe a prayer or ceremonial hall, courtyard, fountain, türbe or graves of former sheikhs, and residential elements. Architecture helps reconstruct how worship, teaching, hospitality and leadership were organised. Names for rooms vary across sources, so photographs and local explanation matter.","terms":["meydan","semahane","türbe"],"activity":"During a future visit, sketch the spaces and record the name local members use for each.","reflection":"What can a building reveal that a written genealogy cannot?","sources":["S1","S5"]},{"id":"succession","path":"Saraçhane","title":"The succession of sheikhs","minutes":22,"modes":["focus","research"],"summary":"Published succession lists are useful starting points but should be checked against the teqe’s own records.","body":"A published Turkish overview lists Sheikh Ahmed, Sheikh Sinan, Sheikh Hüseyin, Sheikh Cemaluddin, Sheikh Şihabuddin, Sheikh Alaüddin, Sheikh Hüseyin, Sheikh Hasan, Sheikh Necati and Sheikh Abidin after Osman Baba. Dates in such lists are not always internally consistent, and transliterations vary. Build the timeline with confidence labels rather than copying it as final.","terms":["succession","postnişin","hilafet"],"activity":"Enter each name into a timeline and mark every uncertain date.","reflection":"What evidence would make a succession entry stronger?","sources":["S6"]},{"id":"current-sheikh","path":"Saraçhane","title":"Current leadership","minutes":9,"modes":["quick","travel"],"summary":"Public sources identify Sheikh Abidin Shehu as the current leader, but current facts should always be rechecked.","body":"Recent public references and the teqe’s public identity have named Sheikh Abidin Shehu as leader of the Saraçhane Halveti-Ramazani asitane. Because leadership can change, the app labels this as current information requiring periodic verification. The best evidence is an official announcement or direct confirmation from the teqe.","terms":["Sheikh Abidin Shehu","current leadership","verification"],"activity":"Record the date and source of the newest confirmation you can find.","reflection":"Why should current leadership be treated differently from a medieval biography?","sources":["S6","S13"]},{"id":"dhikr","path":"Practice","title":"Public dhikr and local variation","minutes":18,"modes":["travel","focus"],"summary":"Halveti sources describe collective vocal dhikr, but the precise Saraçhane form belongs to the living community.","body":"General Halveti reference works describe individual awrad and collective vocal dhikr, sometimes involving sitting, standing, movement and ilahis. Branches differ, and public descriptions do not document every local detail. The app can explain what observers may encounter, but it should not prescribe initiated formulas, breathing patterns or numerical routines.","terms":["dhikr","devran","ilahi"],"activity":"Write down only what you directly observe at a public gathering, without interpreting it immediately.","reflection":"What is the difference between describing a ritual and instructing someone to perform it?","sources":["S7"]},{"id":"sohbet-khidma","path":"Practice","title":"Sohbet, adab and khidma","minutes":13,"modes":["quick","travel"],"summary":"Learning in a teqe happens through conversation, conduct and service as much as through books.","body":"Sohbet means spiritually instructive companionship or conversation. Adab is disciplined conduct and attentiveness. Khidma is service: helping, hosting, cleaning, preparing and supporting others. These practices are easy to overlook because they are less dramatic than ritual, yet they often reveal how a community forms character.","terms":["sohbet","adab","khidma"],"activity":"Choose one act of service you can do without seeking recognition.","reflection":"Why might service teach more than collecting advanced terminology?","sources":["S7"]},{"id":"bayah","path":"Practice","title":"Bay‘a and formal commitment","minutes":12,"modes":["quick","travel"],"summary":"Bay‘a is a formal commitment and should not be treated as an app action or inherited automatically.","body":"In many tariqas, bay‘a marks a formal relationship between a disciple and an authorised guide. Its form, prerequisites and consequences vary. Family heritage can create affection and familiarity, but it does not automatically substitute for personal understanding and consent. An app should prepare questions, not encourage a rushed commitment.","terms":["bay‘a","murid","authorisation"],"activity":"Write five questions you would ask before any formal commitment.","reflection":"What responsibilities should be understood before making a spiritual commitment?","sources":["S7"]},{"id":"ashura","path":"Community","title":"Muharram and Ashura gatherings","minutes":14,"modes":["travel","research"],"summary":"Public announcements show Muharram and Ashura as important communal occasions, but local meaning should be documented directly.","body":"Saraçhane’s public communications address myhybs, dervishes and sheikhs around Muharram and Ashura gatherings. These events can combine remembrance, recitation, hospitality and community presence. Rather than assuming the meaning from another order or region, record the local programme, language and explanation.","terms":["Muharram","Ashura","community gathering"],"activity":"Create an observation sheet for a future gathering: programme, recitations, speakers, food and explanations.","reflection":"How can the same religious date be marked differently across communities?","sources":["S13"]},{"id":"connected-teqes","path":"Community","title":"Saraçhane’s connected teqes","minutes":18,"modes":["focus","research"],"summary":"Historical accounts connect Saraçhane with Halveti lodges in Rahovec, Has and other Balkan locations.","body":"Accounts describe Saraçhane as a source of authorisation for other Halveti lodges. A 2024 report on the Lukinaj teqe, for example, describes sheikhs receiving hilafet from Saraçhane leadership in the twentieth century. Other summaries connect Osman Baba’s authorisation with Rahovec and additional Kosovo lodges. Each connection should be recorded with person, date, type of authorisation and source.","terms":["connected teqe","hilafet","Rahovec"],"activity":"Build a network table linking Saraçhane to each documented lodge.","reflection":"What is stronger evidence of a relationship: shared style, family claim or documented authorisation?","sources":["S6","S14"]},{"id":"oral-history","path":"Research","title":"Interviewing your family","minutes":20,"modes":["focus","research"],"summary":"Oral history preserves valuable memory when questions, uncertainty and consent are recorded carefully.","body":"Ask open questions before suggesting answers. Record the speaker’s exact wording, approximate dates, people present and whether the memory was witnessed or inherited. Ask permission before audio recording or sharing photographs. Keep private family information on your device and separate it from the public app code.","terms":["oral history","consent","provenance"],"activity":"Conduct a 15-minute interview with one relative using the app’s template.","reflection":"How might family loyalty influence memory without making the memory worthless?","sources":["S15"]},{"id":"source-criticism","path":"Research","title":"How to compare sources","minutes":20,"modes":["focus","research"],"summary":"Source criticism asks who made a claim, when, for what purpose and from what evidence.","body":"An official teqe page is strong evidence for how the community describes itself today, but not automatically decisive for every eighteenth-century date. A heritage register may document architecture well but repeat an older historical narrative. An academic article may analyse sources more critically yet misunderstand local terminology. The strongest research compares them rather than declaring one category universally superior.","terms":["primary source","secondary source","confidence"],"activity":"Choose one disputed date and compare three source types.","reflection":"Which type of source is best for current identity, architecture, lineage and private practice?","sources":["S1","S6","S7"]},{"id":"books-beginner","path":"Library","title":"Your first three books","minutes":10,"modes":["quick","travel"],"summary":"Start with readable spiritual ethics and a reliable historical overview before difficult metaphysics.","body":"A balanced beginning is al-Ghazali’s The Beginning of Guidance for disciplined conduct, William Chittick’s Sufism: A Short Introduction for concepts and worldview, and Carl Ernst’s Sufism: An Introduction to the Mystical Tradition of Islam for historical context. Read slowly and compare general Sufism with the specific Saraçhane tradition.","terms":["al-Ghazali","Chittick","Ernst"],"activity":"Choose one book and set a modest first reading target.","reflection":"Do you prefer devotional instruction or academic history first?","sources":["S16","S17","S18"]},{"id":"books-deeper","path":"Library","title":"Deeper and reference reading","minutes":12,"modes":["travel","focus"],"summary":"Schimmel and Trimingham are useful references but should not replace local evidence.","body":"Annemarie Schimmel’s Mystical Dimensions of Islam offers a broad, rich survey of Sufi history, poetry and symbolism. J. Spencer Trimingham’s The Sufi Orders in Islam is an important institutional history, though older scholarship should be read critically. For Saraçhane, local-language articles, heritage records and teqe publications remain essential.","terms":["Schimmel","Trimingham","reference work"],"activity":"Create a reading list with columns: purpose, difficulty, local relevance and status.","reflection":"Why can a famous general book still be weak evidence for one local custom?","sources":["S19","S20"]},{"id":"visit-prep","path":"Research","title":"Preparing for a teqe visit","minutes":16,"modes":["travel","research"],"summary":"A good visit begins with respectful introduction, observation and precise questions.","body":"Introduce your family connection without claiming a formal status you have not confirmed. Ask which gatherings are public, what dress and behaviour are expected, who can explain the history, and whether photographs or recordings are permitted. Observe first. Write questions afterward so that curiosity does not interrupt worship or hospitality.","terms":["visit etiquette","permission","observation"],"activity":"Prepare a ten-question visit sheet and a short Albanian introduction.","reflection":"What would respectful curiosity look like in practice?","sources":["S1","S13"]},{"id":"portfolio","path":"Research","title":"Build your Saraçhane portfolio","minutes":30,"modes":["focus","research"],"summary":"Your final project should preserve both knowledge and uncertainty.","body":"The portfolio can contain a family connection record, a sourced history, a date-comparison table, succession timeline, provisional silsila map, glossary, interview archive, visit notes, connected-teqe network and unanswered questions. A strong portfolio does not pretend to resolve every issue; it shows exactly what is known, by whom and with what confidence.","terms":["portfolio","timeline","unresolved question"],"activity":"Choose one section and create its first complete draft.","reflection":"What would make this archive valuable to you ten years from now?","sources":["S1","S6","S15"]},{"id":"tazkiya-virtues","path":"Tasawwuf","title":"Tazkiya and the work of character","minutes":16,"modes":["travel","focus"],"summary":"Sufi formation begins with repentance, sincerity and character—not unusual experiences.","body":"Tazkiyat al-nafs means purification and growth of the self. Classical Sufi ethics examines pride, envy, showing off, greed, anger, heedlessness and disordered appetite while cultivating tawba, sabr, shukr, tawakkul, ikhlas and mahabba. This is not self-hatred or self-punishment. Responsible spiritual discipline preserves health, family duties, moral accountability and ordinary care.","terms":["tazkiya","nafs","ikhlas","tawba","sabr","shukr","tawakkul","mahabba"],"activity":"Choose one virtue and write how it would appear in a real action rather than only as a feeling.","reflection":"Which character habit would most improve your relationships if you worked on it honestly?","sources":["S21","S7"]},{"id":"nafs-qalb-ruh","path":"Tasawwuf","title":"Nafs, qalb and ruh","minutes":18,"modes":["travel","focus"],"summary":"The self, heart and spirit are related concepts, not a simple diagram of separate inner organs.","body":"Nafs refers to the self as the place of appetite, ego, moral struggle and purification. Qalb, the heart, is the centre of intention, perception and spiritual receptivity. Ruh means spirit, whose full reality is not reducible to psychology. Sufi authors use these terms in different ways, so they should be learned through context rather than treated as a rigid scientific map.","terms":["nafs","qalb","ruh"],"activity":"Write one example of a bodily desire, an intention of the heart and a spiritual question without pretending the three are always separable.","reflection":"Why can oversimplified diagrams distort classical spiritual vocabulary?","sources":["S21","S7"]},{"id":"fana-baqa-marifa","path":"Tasawwuf","title":"Fana, baqa and ma‘rifa","minutes":20,"modes":["focus"],"summary":"These advanced terms describe ethical and experiential transformation, not becoming divine.","body":"Fana is commonly explained as the passing of self-assertion and ego-centredness in orientation to God. Baqa describes stable and responsible servanthood after that transformation. Ma‘rifa refers to realised spiritual recognition. Interpretations differ across authors and orders. None of these terms removes legal or moral responsibility, means physical annihilation, or makes a human being divine.","terms":["fana","baqa","ma‘rifa"],"activity":"Explain each term in one sentence while avoiding claims of divinity or loss of responsibility.","reflection":"Why should advanced mystical vocabulary be studied after ethics and historical context?","sources":["S21","S19"]},{"id":"early-sufi-history","path":"History","title":"From early asceticism to classical Sufism","minutes":22,"modes":["travel","focus"],"summary":"Early Muslim ascetics preceded the organised tariqas that appeared later.","body":"Hasan al-Basri became associated with moral accountability, repentance and warning, while Rabi‘a al-Adawiyya became associated with disinterested love of God. Junayd of Baghdad became a model of sober mystical teaching disciplined by scripture and responsible conduct. Al-Ghazali later integrated worship, ethics, spiritual psychology and the religious sciences. These figures influenced Sufi thought, but they were not founders of modern teqe organisations.","terms":["Hasan al-Basri","Rabi‘a al-Adawiyya","Junayd","al-Ghazali"],"activity":"Place these four figures before the emergence of organised Halveti institutions on a timeline.","reflection":"Why is influence different from direct institutional lineage?","sources":["S21","S18"]},{"id":"tariqas-and-lodges","path":"History","title":"How tariqas and lodges developed","minutes":20,"modes":["travel","focus"],"summary":"Orders formed gradually through teachers, chains, endowments, deputies and physical lodges.","body":"Organised tariqas developed around remembered masters, teaching chains, devotional methods, successor networks, endowments and lodges. Khanqah, zawiya, dergah and tekke overlap but have different regional histories. Lodges could combine prayer, teaching, hospitality, food, residence, manuscripts, music, burial memory and social mediation. They were never organisationally identical.","terms":["khanqah","zawiya","dergah","tekke","waqf"],"activity":"List the religious, educational, social and material functions a teqe may combine.","reflection":"Why is a teqe more than only a room for dhikr?","sources":["S21","S20"]},{"id":"ottoman-balkan-context","path":"History","title":"Sufism in the Ottoman Balkans","minutes":24,"modes":["travel","focus"],"summary":"Balkan Sufi networks interacted with cities, guilds, migration, scholarship and political authority.","body":"In the Ottoman Balkans, Sufi institutions interacted with migration, scholarship, craft and guild life, patronage, waqfs, neighbourhood communities and government. Halveti networks became important in Albania, Kosovo, North Macedonia, Bosnia and nearby regions. It is too simple to claim that dervishes alone Islamised the Balkans; historical change involved many institutions and communities.","terms":["Ottoman Balkans","waqf","guild","migration"],"activity":"Create a map of Prizren, Rahovec and other places connected to your family or the Halveti network.","reflection":"How can religious history be distorted by a single-cause explanation?","sources":["S21","S12"]},{"id":"ahmediyye","path":"Ramazaniyye","title":"The Ahmediyye branch","minutes":18,"modes":["travel","focus"],"summary":"Ramazaniyye developed within the Ahmediyye line of the Halvetiyye.","body":"Ahmediyye is attributed to Yiğitbaşı Ahmed Şemseddin Marmaravî, who died in 1504. Reference literature reconstructs his line through earlier Halveti teachers to Yahya Şirvani. Historical sources associate Ahmediyye with expanded pedagogical use of divine names. That belongs to the history of the branch; it is not a personal litany supplied by this app.","terms":["Ahmediyye","Yiğitbaşı Ahmed Şemseddin Marmaravî","divine names"],"activity":"Add Ahmediyye between Halvetiyye and Ramazaniyye in your branch map.","reflection":"Why can a historical teaching method be described without being assigned to the learner?","sources":["S21","S9"]},{"id":"ramazani-branches","path":"Ramazaniyye","title":"The five Ramazaniyye branches","minutes":17,"modes":["travel","focus"],"summary":"Ramazaniyye developed several named lines through Ramazan Mahfi’s deputies.","body":"Reference literature names five Ramazaniyye branches: Cihangiriyye, Buhuriyye, Hayatiyye, Raufiyye and Cerrahiyye. Shared descent does not make their later customs identical. Regional literature links Osman Baba to a Ramazani-Hayati environment, but the final documentary chain to Saraçhane remains provisional until an authorised silsilaname or ijazet is examined.","terms":["Cihangiriyye","Buhuriyye","Hayatiyye","Raufiyye","Cerrahiyye"],"activity":"Create five branch cards and mark which connection to Saraçhane is documented, provisional or unknown.","reflection":"What is the difference between a secure upper branch and a provisional local transmission?","sources":["S21","S8","S9"]},{"id":"names-location","path":"Saraçhane","title":"Names, spellings and the Saraçhane quarter","minutes":12,"modes":["quick","travel"],"summary":"The teqe appears under several Albanian, Turkish and historical names.","body":"Documented names include Teqja e Saraçhanës, Teqja Halveti, Teqja e Halvetive, Saraçhane Tekkesi, Osman Baba Tekkesi, Şeyh Osman Efendi Tekkesi and Asitane-i Halvetijje Ramazanijje. The complex stands in Prizren’s historic Saraçhane quarter. The neighbourhood name is associated with saraç, an Ottoman saddle or harness maker.","terms":["Saraçhane","saraç","Asitane-i Halvetijje Ramazanijje"],"activity":"Record the preferred current Albanian and Turkish name and note who uses each form.","reflection":"Why do alternative names matter when searching archives?","sources":["S21","S1","S2"]},{"id":"material-culture","path":"Saraçhane","title":"Calligraphy, furnishings and symbols","minutes":23,"modes":["travel","research"],"summary":"Objects can be described physically, historically and locally without confusing those layers.","body":"Published art-historical descriptions mention marble fountains, a finial compared with a Halveti tac, crossed swords, serpent forms, mirrored Muhammad calligraphy, a wooden mihrab, calligraphic panels, a sheikh’s seat, ritual furnishings, horns and a dragon-shaped water spout. Interpretations in art history are not automatically the teqe’s own doctrinal explanation. Record physical observation, inscription, scholarly interpretation and community explanation separately.","terms":["tac","mihrab","mirrored calligraphy","material culture"],"activity":"Design a catalogue card with fields for object, material, inscription, visible condition, source and local explanation.","reflection":"Why can a photograph prove an object exists but not prove what it means?","sources":["S21","S1"]},{"id":"manuscripts-berats","path":"Saraçhane","title":"Manuscripts, berats and archival evidence","minutes":22,"modes":["focus","research"],"summary":"Reported archival holdings may contain the strongest evidence, but they must be catalogued responsibly.","body":"Regional scholarship reports manuscripts and berats at Saraçhane, but no complete public item-level catalogue was located. A responsible record would include shelf mark, title, incipit, author, copyist, date, script, language, dimensions, seals, ownership notes, colophon, condition, provenance and publication rights. Do not invent titles or handle fragile materials without permission and conservation guidance.","terms":["manuscript","berat","ijazet","colophon","provenance"],"activity":"Create a blank archival catalogue template for any document the teqe permits you to study.","reflection":"Which questions about foundation, lineage and succession might archival documents resolve?","sources":["S21"]},{"id":"social-role","path":"Community","title":"The teqe as a living institution","minutes":17,"modes":["travel","focus"],"summary":"Saraçhane combines spiritual, educational, social and cultural functions.","body":"The complex and its continuing public activity indicate overlapping roles in worship, companionship, education, hospitality, residence, burial memory, service and neighbourhood life. Precise claims about present charity, classes, funding or diaspora organisation require current confirmation. The teqe should be understood as a living community, not only as a protected monument.","terms":["hospitality","burial memory","living heritage","community"],"activity":"Separate functions directly documented today from functions inferred from the historical building.","reflection":"What changes when a heritage monument is also an active religious home?","sources":["S21","S1","S13"]},{"id":"yugoslav-postwar","path":"Saraçhane","title":"Yugoslav, war and postwar history","minutes":21,"modes":["focus","research"],"summary":"This period is important but remains underdocumented in currently available Saraçhane-specific sources.","body":"The succession through Shejh Hasan, Shejh Necati and Shejh Abidin shows continuity across Yugoslav and post-Yugoslav periods. Heritage records mention restoration after 1999, but current sources do not yet provide a full chronology of property administration, restrictions, migration, archive loss, war damage or postwar revival. This should remain an open research project using records, restoration dossiers, photographs and interviews.","terms":["Yugoslavia","1998–1999 war","restoration","diaspora"],"activity":"Build a decade-by-decade question list from 1945 to the present.","reflection":"Whose memories might be absent if you interview only current male office-holders?","sources":["S21","S1"]},{"id":"expanded-roles","path":"Practice","title":"Roles, offices and honorifics","minutes":21,"modes":["travel","focus"],"summary":"Participation categories, functions, offices and honorifics must not be collapsed into one rank ladder.","body":"Visitor, myhyb, murid, dervish, zakir, rehber, halife, baba, sheikh, pir, postnişin and asitane sheikh describe different things. Some indicate attachment or discipleship, some a liturgical function, some delegated authority, some lodge leadership and some historical honour. Saraçhane publicly distinguishes myhybs, dervishes and sheikhs, while the current local use of murid, zakir and rehber still requires confirmation.","terms":["murid","zakir","rehber","baba","pir","postnişin"],"activity":"Classify each term as participation, relationship, function, office, authorisation or honorific.","reflection":"Why is ‘higher rank’ often the wrong question?","sources":["S21","S13"]},{"id":"guided-practices","path":"Practice","title":"Learning about guided practices","minutes":24,"modes":["travel","focus"],"summary":"You can study bay‘a, awrad, halvet and seyr-u suluk fully without the app pretending to assign them.","body":"Bay‘a establishes a formal relationship of guidance. Awrad are regular recitations that may be public, general or personally assigned. Seyr-u suluk means guided spiritual formation, and halvet is supervised retreat. The app should teach their history, purpose, vocabulary, variations and place in Halveti life. Personal formulas, counts, retreat conditions and claims of authorisation belong to a qualified living guide.","terms":["bay‘a","awrad","seyr-u suluk","halvet","ijazet"],"activity":"For each practice, write: what it means, what is publicly learnable and what requires personal guidance.","reflection":"How does this distinction allow serious learning without pretending an app is a sheikh?","sources":["S21","S7","S11"]},{"id":"turbe-ilahis","path":"Practice","title":"Türbe visits, salawat and ilahis","minutes":18,"modes":["travel","research"],"summary":"These are part of the wider devotional environment, while local etiquette and repertoire must be confirmed.","body":"Saraçhane includes a türbe where leaders are buried. Current rules for access, photography, recitation, touching objects and participation should be learned from hosts. Salawat and ilahis belong to the wider Sufi and Prizren environment, but texts, languages, melodies, instruments and ritual placement vary. A song heard in Prizren is not automatically part of Saraçhane’s authorised repertoire.","terms":["türbe","salawat","ilahi","repertoire"],"activity":"Prepare a visit checklist that asks permission before photography or recording and records the provenance of any ilahi.","reflection":"Why should etiquette and provenance be learned locally?","sources":["S21","S1","S13"]},{"id":"preserving-family-archive","path":"Research","title":"Preserving photographs, objects and memories","minutes":20,"modes":["focus","research"],"summary":"Good preservation keeps original wording, provenance, rights and uncertainty.","body":"Preserve a speaker’s exact wording before translating. Record uncertain dates as spoken rather than replacing them with guesses. Photograph an object before moving it, record its owner and provenance, preserve an unchanged master file and create separate access copies. Keep at least two backups and document publication permission. A photograph can prove presence but not by itself prove bay‘a, office or authorisation.","terms":["master file","access copy","rights","provenance"],"activity":"Create a naming and backup system for your first ten family photographs or documents.","reflection":"What private information should never be published in the public app?","sources":["S21","S15"]},{"id":"open-questions","path":"Research","title":"The unresolved Saraçhane questions","minutes":18,"modes":["travel","research"],"summary":"A serious archive keeps unanswered questions visible instead of filling gaps with guesses.","body":"Key unresolved questions include the earliest contemporary document naming the teqe, what each foundation date describes, who authorised Osman Baba, the exact silsila, the correct death date of Osman Baba, the verified succession and the current scope of asitane authority. Other questions concern manuscripts, present roles, visitor access, Yugoslav history and diaspora activity.","terms":["unresolved question","research agenda","primary document"],"activity":"Choose three unresolved questions and list the exact evidence that could answer each.","reflection":"Why is an honest unanswered question more valuable than a confident invention?","sources":["S21"]}],"sources":[{"id":"S1","title":"Kosovo Cultural Heritage Database: Teqja Halveti","type":"Official heritage","url":"https://dtk.rks-gov.net/Objekti?heritageId=1469","note":"Location, heritage status, Osman Baba narrative and architectural context."},{"id":"S2","title":"Historiku i Teqesë së Halvetive të Prizrenit","type":"Local history","url":"https://gazetaeprizrenit.net/historiku-i-teqese-se-halvetive-te-prizrenit-foto/","note":"Detailed local account; useful but not equivalent to a critical academic edition."},{"id":"S3","title":"Prizreni i Mitrush Kutelit","type":"Cultural article","url":"https://www.koha.net/shtojca-kulture/prizreni-i-mitrush-kutelit","note":"Cites 1713 and describes graves and local memory."},{"id":"S5","title":"Tekké Halveti, Prizren","type":"Travel/heritage guide","url":"https://www.petitfute.de/v57385-prizren/c1173-visites-points-d-interet/c925-edifice-religieux/1567354-tekke-halveti.html","note":"Useful for visitor-facing architectural description; lower authority for early history."},{"id":"S6","title":"Halvetilik and the Kosovo Halveti Tekke","type":"Historical overview","url":"https://tuicakademi.org/halvetilik-halvetiligin-balkanlara-etkisi-kosova-halveti-tekkesi-tarihi-gunumuz-uzerine/","note":"Provides 1712, succession list and current leadership claim; verify citations."},{"id":"S7","title":"TDV İslâm Ansiklopedisi: Halvetiyye","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/halvetiyye","note":"Authoritative overview of origins, branches and general Halveti practices."},{"id":"S8","title":"TDV: Ramazan Efendi Mahfi","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/ramazan-efendi-mahfi","note":"Biography of the founder of Ramazaniyye."},{"id":"S9","title":"TDV: Ramazâniyye","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/ramazaniyye--tarikat","note":"Defines Ramazaniyye as a branch of Halvetiyye-Ahmediyye."},{"id":"S10","title":"TDV: Ömer el-Halvetî","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/omer-el-halveti","note":"Biography of the eponymous founder of Halvetiyye."},{"id":"S11","title":"TDV: Halvet (tasavvuf)","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/halvet--tasavvuf","note":"Historical explanation of spiritual seclusion."},{"id":"S12","title":"TDV: Prizren","type":"Academic reference","url":"https://islamansiklopedisi.org.tr/prizren","note":"Ottoman and religious history of Prizren."},{"id":"S13","title":"Halveti Kosovo public channel","type":"Community source","url":"https://www.instagram.com/halvetikosove/","note":"Useful for current self-description and public announcements; current facts should be rechecked."},{"id":"S14","title":"100th anniversary of the Halveti teqe in Lukinaj","type":"Community/local report","url":"https://prizrenpress.com/shenohet-100-vjetori-i-pasardhesve-te-teqes-se-halvetive-ne-lukije-te-hasit/","note":"Documents claimed authorisation links to Saraçhane."},{"id":"S15","title":"Oral History Association: Principles and Best Practices","type":"Method guide","url":"https://oralhistory.org/principles-and-best-practices-revised-2018/","note":"Interview consent, documentation and preservation guidance."},{"id":"S16","title":"The Beginning of Guidance","type":"Book","url":"https://www.worldcat.org/search?q=The+Beginning+of+Guidance+Ghazali","note":"Practical ethical and devotional introduction by al-Ghazali."},{"id":"S17","title":"Sufism: A Short Introduction","type":"Book","url":"https://search.worldcat.org/title/43762518","note":"Accessible conceptual introduction by William C. Chittick."},{"id":"S18","title":"Sufism: An Introduction to the Mystical Tradition of Islam","type":"Book","url":"https://uncpress.org/book/9780807848659/sufism/","note":"Historical and critical introduction by Carl W. Ernst."},{"id":"S19","title":"Mystical Dimensions of Islam","type":"Book","url":"https://uncpress.org/book/9780807899762/mystical-dimensions-of-islam/","note":"Broad reference by Annemarie Schimmel; German original also useful."},{"id":"S20","title":"The Sufi Orders in Islam","type":"Book","url":"https://global.oup.com/academic/product/the-sufi-orders-in-islam-9780195120585","note":"Classic institutional history by J. Spencer Trimingham."},{"id":"S21","title":"Deep research synthesis: Sufism, Halvetiyye–Ramazaniyye and Teqja e Saraçhanës","type":"User-supplied research synthesis","url":"","note":"Comprehensive multilingual research report supplied on 1 August 2026; preserves confidence labels, disputes and unresolved questions."}],"glossary":{"tasawwuf":"Islamic traditions of spiritual discipline, character formation and experiential knowledge.","tariqa":"An organised Sufi path or order with a method, lineage and community.","silsila":"A chain of transmission linking authorised teachers.","myhyb":"A local form of muhib: a person attached through love, support or participation.","dervish":"A committed member or disciple in a Sufi path; exact local requirements vary.","halife":"An authorised representative; the scope of authority varies.","sheikh":"An authorised spiritual guide, often responsible for teaching and leadership.","adab":"Disciplined conduct, manners and attentiveness.","sohbet":"Spiritually instructive companionship or conversation.","khidma":"Service to people, the community and the lodge.","dhikr":"Remembrance of God, individually or collectively.","halvet":"Spiritual seclusion; formal practice requires guidance.","seyr-u suluk":"Structured spiritual training or progression.","bay‘a":"A formal commitment to an authorised guide.","asitane":"A principal or mother lodge in Ottoman Sufi institutional language.","türbe":"A mausoleum or tomb structure.","postnişin":"The person occupying the leadership seat of a lodge.","hilafet":"Authorisation to represent or guide within a tariqa context.","ilahi":"A devotional hymn.","meydan":"A ceremonial or gathering space; local naming varies.","tazkiya":"Purification and growth of the self through repentance, worship, discipline and virtue.","nafs":"The self as the locus of appetite, ego, moral struggle and purification.","qalb":"The heart as the centre of intention and spiritual receptivity.","ruh":"Spirit; its full reality is not reducible to a psychological diagram.","ikhlas":"Sincerity and purification of intention.","tawba":"Turning back to God, leaving wrongdoing and repairing harm.","sabr":"Steadfast patience, not passive acceptance of abuse.","shukr":"Gratitude expressed through recognition, speech and action.","tawakkul":"Reliance on God while taking responsible means.","mahabba":"Love of God expressed through obedience, mercy, remembrance and longing.","ma‘rifa":"Realised spiritual recognition, not unrestricted claims to secret knowledge.","fana":"Passing of ego-centred self-assertion in orientation to God; not becoming divine.","baqa":"Stable and responsible servanthood after fana.","awrad":"Plural of wird: regular recitations, sometimes public and sometimes personally assigned.","murid":"A seeker or disciple in a relationship of spiritual guidance.","murshid":"A spiritual guide with a defined scope of authority.","zakir":"A reciter or liturgical-musical function; current formal Saraçhane use requires confirmation.","rehber":"A guide or delegated mentor in some tariqas; local use requires confirmation.","baba":"An honorific meaning spiritual father; not universally equivalent to sheikh.","pir":"An ancestral founder or great master, not an ordinary current rank.","semahane":"A hall used for collective ceremony or prayer; local naming varies.","berat":"An official written grant or appointment document in Ottoman contexts.","ijazet":"Written or transmitted authorisation to teach, transmit or represent within a defined scope.","provenance":"The documented history of ownership, origin and custody of an object or document."}};const KEY='sarachhane-study-v3';let state={completed:[],saved:[],review:[],lastLesson:null,lastMode:'all',sessions:0,lastStudied:null,lastSaved:null};let speech=null;
function load(){try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}function save(){state.lastSaved=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});idbSave()}function idbSave(){let r=indexedDB.open('sarachhane-study',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{let db=r.result;db.transaction('state','readwrite').objectStore('state').put(state,'main');db.close()}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function lesson(id){return DATA.lessons.find(x=>x.id===id)}function source(id){return DATA.sources.find(x=>x.id===id)}function pct(){return Math.round(state.completed.length/DATA.lessons.length*100)}
function renderLearn(){let current=lesson(state.lastLesson)||DATA.lessons.find(x=>!state.completed.includes(x.id))||DATA.lessons[0];let filtered=DATA.lessons.filter(x=>state.lastMode==='all'||x.modes.includes(state.lastMode)).filter(x=>!state.completed.includes(x.id)).slice(0,5);document.getElementById('learn').innerHTML=`<div class="hero"><div class="eyebrow">Self-paced study</div><h2>Learn the tradition you inherited.</h2><p class="lede">A sourced guide to tasawwuf, Halvetiyye–Ramazaniyye and Teqja e Saraçhanës in Prizren. Learn both public history and the meaning of guided practices, without schedules or streak pressure.</p><div class="continue"><div><div class="eyebrow">Continue learning</div><h3>${esc(current.title)}</h3><p class="notice">${esc(current.path)} · ${current.minutes} min</p></div><button class="btn" onclick="openLesson('${current.id}')">Continue</button></div></div><div class="metrics"><div class="metric"><b>${state.completed.length}</b>lessons</div><div class="metric"><b>${pct()}%</b>complete</div><div class="metric"><b>${state.review.length}</b>to review</div></div><div class="progressline" aria-label="${pct()} percent complete"><span style="width:${pct()}%"></span></div><div class="sectionhead"><h3>Choose your time</h3></div><div class="modes">${[['all','Any time'],['quick','5–10 min'],['travel','Bus / walk'],['focus','Focused']].map(([k,l])=>`<button class="mode ${state.lastMode===k?'active':''}" onclick="setMode('${k}')"><b>${l}</b><br><span class="notice">${k==='all'?'Show everything':k==='quick'?'Short lessons':k==='travel'?'Listen or read': 'Longer study'}</span></button>`).join('')}</div><div class="sectionhead"><h3>Recommended next</h3><span class="notice">${filtered.length} shown</span></div><div class="list">${filtered.map(row).join('')}</div>`}
function row(x){let done=state.completed.includes(x.id);return `<button class="lessonrow ${done?'done':''}" onclick="openLesson('${x.id}')"><span class="mark">${done?'✓':x.path.slice(0,2).toUpperCase()}</span><span><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></span><span class="time">${x.minutes}m</span></button>`}
function renderPaths(filter=''){let q=filter.toLowerCase();let paths=[...new Set(DATA.lessons.map(x=>x.path))];document.getElementById('paths').innerHTML=`<div class="eyebrow">Curriculum</div><h2>Learning paths</h2><p class="lede">Recommended order, never locked. Open any subject when it becomes relevant.</p><input class="search" aria-label="Search lessons" placeholder="Search lessons and topics" value="${esc(filter)}" oninput="renderPaths(this.value)">${paths.map(p=>{let ls=DATA.lessons.filter(x=>x.path===p&&(!q||(x.title+' '+x.summary+' '+x.body).toLowerCase().includes(q)));if(!ls.length)return'';return `<div class="path"><h3 class="path-title">${esc(p)}</h3><div class="list">${ls.map(row).join('')}</div></div>`}).join('')}`}
function renderLibrary(filter=''){let q=filter.toLowerCase();let srcs=DATA.sources.filter(s=>!q||(s.title+' '+s.type+' '+s.note).toLowerCase().includes(q));document.getElementById('library').innerHTML=`<div class="eyebrow">Books and evidence</div><h2>Source library</h2><p class="lede">Each lesson links back to a source. Historical disagreements remain visible instead of being flattened into one story.</p><input class="search" placeholder="Search sources and books" value="${esc(filter)}" oninput="renderLibrary(this.value)"><div class="card"><b>Suggested reading order</b><p>1. Al-Ghazali, <i>The Beginning of Guidance</i><br>2. William Chittick, <i>Sufism: A Short Introduction</i><br>3. Carl Ernst, <i>Sufism</i><br>4. Annemarie Schimmel, <i>Mystical Dimensions of Islam</i></p></div>${srcs.map(s=>`<div class="source"><small>${esc(s.id)} · ${esc(s.type)}</small><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Open source ↗</a>`:`<span class="notice">Attached research source</span>`}</div>`).join('')}`}
function renderRoadmap(){let groups=[
['1','Foundations','Tasawwuf, ihsan, tazkiya, nafs, qalb and ruh','tasawwuf'],
['2','Early history','Hasan al-Basri, Rabi‘a, Junayd and al-Ghazali','early-history'],
['3','Halvetiyye','Ömer el-Halvetî, Yahya Shirvani, branches and halvet','halvetiyye-origins'],
['4','Ahmediyye & Ramazaniyye','Yiğitbaşı Ahmed, Ramazan Mahfi and the five branches','ahmediyye'],
['5','Saraçhane','Osman Baba, foundation dates, architecture and succession','osman-baba'],
['6','Practice & roles','Dhikr, sohbet, bay‘a, awrad, seyr-u suluk and offices','dhikr'],
['7','Sources & deeper study','Books, articles, heritage records and unresolved questions','books-beginner']
];document.getElementById('roadmap').innerHTML=`<div class="eyebrow">Step-by-step route</div><h2>Learning roadmap</h2><p class="lede">Follow the stages in order or open any topic when it becomes relevant. Each stage points to lessons and outside sources you can research further.</p><div class="path">${groups.map(g=>`<button class="lessonrow" onclick="openLesson('${g[3]}')"><span class="mark">${g[0]}</span><span><h3>${esc(g[1])}</h3><p>${esc(g[2])}</p></span><span class="time">Open</span></button>`).join('')}</div><div class="card"><h3>How to use this roadmap</h3><p>Read the app lesson first, then open its listed sources. Save important lessons or mark them for review. For disputed Saraçhane history, compare the wording of several sources rather than choosing one date or claim automatically.</p></div>`} 
function openLesson(id){let x=lesson(id);state.lastLesson=id;state.sessions++;state.lastStudied=new Date().toISOString();save();let src=x.sources.map(id=>source(id)).filter(Boolean);document.getElementById('lessonBody').innerHTML=`<div class="dialogtop"><div><div class="eyebrow">${esc(x.path)} · ${x.minutes} minutes</div><h3>${esc(x.title)}</h3></div><button class="close" aria-label="Close lesson" onclick="closeLesson()">×</button></div><div class="lessoncopy"><p class="lede">${esc(x.summary)}</p><p>${esc(x.body)}</p><div class="terms">${x.terms.map(t=>`<button class="termchip" onclick="openTerm('${esc(t)}')">${esc(t)}</button>`).join('')}</div><div class="callout"><b>Activity</b><br>${esc(x.activity)}</div><p><b>Reflection</b><br>${esc(x.reflection)}</p><h3>Sources</h3>${src.map(s=>`<p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.id)} · ${esc(s.title)}</a>`:`<b>${esc(s.id)} · ${esc(s.title)}</b>`}<br><span class="notice">${esc(s.note)}</span></p>`).join('')}<div class="lesson-actions"><button class="btn ${state.completed.includes(id)?'secondary':''}" onclick="toggleComplete('${id}')">${state.completed.includes(id)?'Completed ✓':'Mark as understood'}</button><button class="btn secondary" onclick="toggleSaved('${id}')">${state.saved.includes(id)?'Saved ✓':'Save for later'}</button><button class="btn secondary" onclick="toggleReview('${id}')">${state.review.includes(id)?'Review marked ✓':'Mark for review'}</button><button class="btn ghost" onclick="speakLesson('${id}')">Listen</button></div></div>`;lessonDialog.showModal()}
function closeLesson(){speechSynthesis.cancel();lessonDialog.close();renderAll()}function toggleComplete(id){state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();openLesson(id)}function toggleSaved(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();openLesson(id)}function toggleReview(id){state.review=state.review.includes(id)?state.review.filter(x=>x!==id):[...state.review,id];save();openLesson(id)}function speakLesson(id){speechSynthesis.cancel();let x=lesson(id);speech=new SpeechSynthesisUtterance(`${x.title}. ${x.summary}. ${x.body}. Activity: ${x.activity}. Reflection: ${x.reflection}`);speech.lang='en-GB';speech.rate=.92;speechSynthesis.speak(speech)}function openTerm(t){let v=DATA.glossary[t]||'This term appears in the lesson but needs local confirmation or a fuller glossary entry.';document.getElementById('termBody').innerHTML=`<div class="dialogtop"><div><div class="eyebrow">Glossary</div><h3>${esc(t)}</h3></div><button class="close" aria-label="Close glossary" onclick="termDialog.close()">×</button></div><p>${esc(v)}</p>`;termDialog.showModal()}
function setMode(m){state.lastMode=m;save();renderLearn()}
function renderAll(){renderLearn();renderPaths();renderRoadmap();renderLibrary()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');b.classList.add('active');scrollTo(0,0)});load();renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
