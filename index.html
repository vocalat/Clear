<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f0e9"><title>Saraçhane Study</title><link rel="manifest" href="manifest.webmanifest"><style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif;font-size:17px;line-height:1.62;padding-bottom:calc(82px + var(--safe-b))}button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.app{max-width:860px;margin:auto}header{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.brand{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand h1{font-size:1.12rem;margin:0;letter-spacing:.02em}.save{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:var(--muted)}main{padding:24px 18px 34px}.screen{display:none}.screen.active{display:block}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--muted);margin-bottom:8px}h2{font-size:clamp(2rem,9vw,3.7rem);line-height:.98;letter-spacing:-.045em;margin:.15em 0 .35em;max-width:13ch}h3{font-size:1.28rem;line-height:1.15;margin:.2em 0 .5em}p{margin:.55em 0 1em}.lede{font-size:1.08rem;color:var(--muted);max-width:58ch}.hero{padding:22px 0 30px;border-bottom:4px solid var(--ink)}.continue{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:28px;padding:20px 0;border-top:1px solid var(--line)}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:13px 17px;min-height:48px;border-radius:3px;font-weight:700}.btn.secondary{background:transparent;color:var(--ink)}.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink)}.progressline{height:6px;background:var(--paper2);margin:16px 0 8px}.progressline span{display:block;height:100%;background:var(--accent);transition:width .25s ease}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0}.metric{padding:13px 8px;border-right:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:var(--muted)}.metric:last-child{border-right:0}.metric b{display:block;color:var(--ink);font-family:ui-serif,Georgia,serif;font-size:1.55rem}.modes{display:grid;gap:10px;margin:18px 0}.mode{text-align:left;background:var(--surface);border:1px solid var(--line);padding:14px;min-height:64px}.mode.active{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:34px 0 12px}.sectionhead h3{margin:0}.list{border-top:1px solid var(--line)}.lessonrow{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:13px;text-align:left;align-items:center;padding:17px 0;border:0;border-bottom:1px solid var(--line);background:transparent}.mark{width:34px;height:34px;border:1px solid var(--line);display:grid;place-items:center;font-family:ui-monospace,monospace;font-size:.72rem}.lessonrow.done .mark{background:var(--accent2);color:white;border-color:var(--accent2)}.lessonrow h3{font-size:1rem;margin:0 0 3px}.lessonrow p{font-size:.84rem;color:var(--muted);margin:0;line-height:1.35}.lessonrow .time{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted)}.path{margin:32px 0}.path-title{font-size:1.55rem;border-bottom:2px solid var(--ink);padding-bottom:8px}.search{width:100%;border:1px solid var(--line);background:var(--surface);padding:14px;min-height:48px;margin:10px 0 18px}.card{background:var(--surface);border:1px solid var(--line);padding:18px;margin:12px 0}.tag{display:inline-block;font-family:ui-monospace,monospace;font-size:.68rem;border:1px solid var(--line);padding:3px 7px;margin:0 5px 5px 0}.source{padding:16px 0;border-bottom:1px solid var(--line)}.source:last-child{border-bottom:0}.source small{font-family:ui-monospace,monospace;color:var(--muted)}dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(760px,100%);max-height:92dvh;margin:auto;border-radius:0;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.56)}.dialogbody{padding:22px;overflow:auto;max-height:92dvh}.dialogtop{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}.close{width:44px;height:44px;background:transparent;border:1px solid var(--line);font-size:1.4rem}.lessoncopy{max-width:65ch}.callout{border-left:4px solid var(--accent);padding:12px 14px;background:var(--paper2);margin:18px 0}.terms{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.termchip{border:1px solid var(--line);background:transparent;padding:8px 10px;min-height:44px}.lesson-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.quiz{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.quiz button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;padding:12px;margin:8px 0;min-height:48px}.quiz button.correct{border-color:var(--accent2);box-shadow:inset 4px 0 var(--accent2)}.quiz button.wrong{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent)}.roadmap{margin:28px 0;border-left:2px solid var(--line);padding-left:22px}.roadmap-step{position:relative;padding:0 0 28px}.roadmap-step:before{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ink);background:var(--paper);left:-30px;top:4px}.roadmap-step.done:before{background:var(--accent2);border-color:var(--accent2)}.roadmap-step h3{margin:0 0 5px}.book{border-top:2px solid var(--ink);padding:18px 0 24px}.bookmeta{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted)}.extract{background:var(--paper2);padding:13px 15px;border-left:4px solid var(--accent2)}nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe-b));display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:transparent;min-height:51px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.68rem;color:var(--muted)}nav button.active{color:var(--accent);font-weight:800}.notice{font-size:.86rem;color:var(--muted)}@media(min-width:700px){main{padding:38px 28px 50px}.modes{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="app"><header><div class="brand"><h1>Saraçhane Study</h1><div class="save" id="saveStatus">Progress saved on this device</div></div></header><main><section id="home" class="screen active"></section><section id="roadmap" class="screen"></section><section id="lessons" class="screen"></section><section id="library" class="screen"></section><section id="glossary" class="screen"></section></main></div><nav aria-label="Primary"><button data-screen="home" class="active">Home</button><button data-screen="roadmap">Roadmap</button><button data-screen="lessons">Lessons</button><button data-screen="library">Library</button><button data-screen="glossary">Glossary</button></nav><dialog id="lessonDialog"><div class="dialogbody" id="lessonBody"></div></dialog><dialog id="termDialog"><div class="dialogbody" id="termBody"></div></dialog><script>const DATA={"lessons":[{"id":"tasawwuf-ihsan","path":"Foundations","title":"Tasawwuf and ihsan","minutes":10,"modes":["quick","travel"],"summary":"Understand tasawwuf as Islamic spiritual and ethical formation, not a separate religion.","body":"Tasawwuf is a broad Islamic tradition concerned with ihsan, sincerity, remembrance of God, purification of character, companionship and service. It developed through teachers, texts, communities and institutions. It should not be reduced to poetry, music or emotional experiences, even though those may appear in some Sufi cultures.","terms":["tasawwuf","ihsan","tazkiya"],"check":{"q":"Which description is most accurate?","options":["A separate religion","Islamic ethical and spiritual formation","Only devotional music"],"answer":1,"explain":"Tasawwuf developed within Islam as a tradition of spiritual and ethical formation."},"sources":["S1","S2"]},{"id":"tazkiya","path":"Foundations","title":"Tazkiya and the work of character","minutes":14,"modes":["travel","focus"],"summary":"Learn how Sufi ethics addresses pride, envy, anger, greed and showing off.","body":"Tazkiyat al-nafs means the purification and growth of the self. Classical Sufi ethics studies destructive habits such as pride, envy, ostentation, greed and heedlessness while cultivating repentance, patience, gratitude, sincerity and love. This is not self-hatred: the purpose is responsible servanthood and better conduct.","terms":["tazkiya","nafs","ikhlas"],"check":{"q":"What is the aim of tazkiya?","options":["Self-hatred","Purification and growth of character","Escaping all responsibilities"],"answer":1,"explain":"Tazkiya aims at moral growth, sincere worship and responsible conduct."},"sources":["S1","S3"]},{"id":"nafs-qalb-ruh","path":"Foundations","title":"Nafs, qalb and ruh","minutes":16,"modes":["travel","focus"],"summary":"Distinguish the self, spiritual heart and spirit without turning them into a simplistic diagram.","body":"Nafs often refers to the self as the site of appetite, ego and moral struggle. Qalb, the heart, is described as the centre of intention and spiritual receptivity. Ruh means spirit, whose full reality is not reducible to psychology. Sufi authors use these terms in different ways, so context matters.","terms":["nafs","qalb","ruh"],"check":{"q":"Which term most often refers to the spiritual heart?","options":["Nafs","Qalb","Halvet"],"answer":1,"explain":"Qalb is the term commonly used for the heart as a centre of intention and receptivity."},"sources":["S1","S4"]},{"id":"tawba-sabr-shukr","path":"Foundations","title":"Repentance, patience and gratitude","minutes":12,"modes":["quick","travel"],"summary":"Three central qualities in Sufi ethical formation.","body":"Tawba is turning back to God, leaving wrongdoing and repairing harm. Sabr is steadfast patience rather than passive acceptance of injustice. Shukr is gratitude expressed through recognition, speech and action. These qualities are repeatedly discussed in classical Sufi manuals.","terms":["tawba","sabr","shukr"],"check":{"q":"Which statement about sabr is correct?","options":["It means accepting abuse","It means steadfast patience","It means avoiding responsibility"],"answer":1,"explain":"Sabr is steadfastness and disciplined patience, not passive acceptance of harm."},"sources":["S3","S4"]},{"id":"tawakkul-mahabba","path":"Foundations","title":"Reliance and love","minutes":12,"modes":["quick","travel"],"summary":"Learn how tawakkul and mahabba are understood in Sufi teaching.","body":"Tawakkul means relying upon God while still taking responsible means. Mahabba is love of God expressed through obedience, mercy, remembrance and longing. Neither concept removes ordinary duties or excuses irresponsibility.","terms":["tawakkul","mahabba","dhikr"],"check":{"q":"What does tawakkul require?","options":["Doing nothing","Taking responsible means while relying on God","Ignoring consequences"],"answer":1,"explain":"Classical teaching combines reliance on God with responsible action."},"sources":["S3"]},{"id":"fana-baqa","path":"Foundations","title":"Fana, baqa and ma‘rifa","minutes":18,"modes":["focus"],"summary":"Approach advanced Sufi vocabulary carefully and contextually.","body":"Fana describes the passing away of self-assertion in orientation toward God; it does not mean physical annihilation or becoming divine. Baqa describes stable, responsible servanthood after fana. Ma‘rifa refers to realised spiritual recognition. Interpretations differ across authors and schools, so these concepts should be studied through reliable commentaries.","terms":["fana","baqa","ma‘rifa"],"check":{"q":"What does fana not mean?","options":["Passing of self-assertion","Becoming divine","A classical Sufi concept"],"answer":1,"explain":"Classical Sunni Sufi teaching does not understand fana as becoming divine."},"sources":["S1","S4"]},{"id":"early-ascetics","path":"History","title":"Early asceticism","minutes":14,"modes":["travel","focus"],"summary":"See how early Muslim asceticism preceded organised tariqas.","body":"Early Muslim ascetics emphasised accountability, repentance, night worship, restraint and remembrance. Later Sufi literature associated figures such as Hasan al-Basri and Rabi‘a al-Adawiyya with sober moral warning and disinterested love of God. They should not be presented as founders of modern lodge organisations.","terms":["zuhd","Hasan al-Basri","Rabi‘a"],"check":{"q":"Did early ascetics found modern tariqa organisations?","options":["Yes, in their present form","No; organised tariqas developed later","Only in the Balkans"],"answer":1,"explain":"Organised tariqas developed gradually in later centuries."},"sources":["S1","S5"]},{"id":"junayd-ghazali","path":"History","title":"Junayd and al-Ghazali","minutes":16,"modes":["travel","focus"],"summary":"Understand two major models of sober, disciplined spirituality.","body":"Junayd of Baghdad became a model of sober mystical teaching disciplined by scripture and responsible conduct. Abu Hamid al-Ghazali later integrated worship, social ethics, spiritual psychology and religious learning in an influential Sunni synthesis. Al-Ghazali is highly useful for ethical formation but is not a direct founder in Saraçhane’s lineage.","terms":["Junayd","al-Ghazali","sober Sufism"],"check":{"q":"Why is al-Ghazali important here?","options":["He founded Saraçhane","He integrated ethics, worship and spiritual psychology","He founded Halvetiyye"],"answer":1,"explain":"Al-Ghazali’s importance is intellectual and ethical, not direct Saraçhane lineage."},"sources":["S1","S3"]},{"id":"formation-tariqas","path":"History","title":"How tariqas formed","minutes":18,"modes":["focus"],"summary":"Learn how teaching chains, lodges and successor networks developed.","body":"Organised tariqas developed gradually around remembered masters, teaching chains, transmitted devotional methods, successor networks, endowments and physical lodges. Terms such as khanqah, zawiya, dergah and tekke overlap but have different regional histories. Lodges could combine prayer, teaching, hospitality, burial, residence and manuscript culture.","terms":["tariqa","tekke","waqf"],"check":{"q":"Which was part of tariqa formation?","options":["Only poetry","Teaching chains and lodges","No institutions at all"],"answer":1,"explain":"Tariqas developed through teachers, chains, methods, institutions and communities."},"sources":["S1","S6"]},{"id":"ottoman-balkans","path":"History","title":"Sufism in the Ottoman Balkans","minutes":20,"modes":["travel","focus"],"summary":"Place Saraçhane inside the wider social history of Balkan Sufi institutions.","body":"Ottoman Balkan Sufi institutions interacted with migration, scholarship, guilds, waqfs, local elites and neighbourhood communities. Halveti institutions became important in Albania, Kosovo, North Macedonia, Bosnia and nearby regions. It is too simplistic to claim that dervishes alone Islamised the Balkans.","terms":["Ottoman Balkans","waqf","guild"],"check":{"q":"Which statement is too simplistic?","options":["Sufi institutions had social roles","Dervishes alone Islamised the Balkans","Halveti lodges existed in Kosovo"],"answer":1,"explain":"Islamisation was a complex historical process involving many institutions and actors."},"sources":["S6","S7"]},{"id":"kosovo-prizren","path":"History","title":"Kosovo and Prizren’s Sufi landscape","minutes":16,"modes":["travel","focus"],"summary":"Understand Saraçhane as one important institution within a diverse local landscape.","body":"Kosovo has included Halveti, Sa‘di, Rifa‘i, Qadiri, Bektashi, Melami and other Sufi communities. Prizren became an important centre of teqes, devotional music, religious learning and neighbourhood traditions. Saraçhane is central to this history but does not represent every Kosovar Sufi tradition.","terms":["Prizren","teqe","Kosovo Sufism"],"check":{"q":"Does Saraçhane represent every Sufi order in Kosovo?","options":["Yes","No","Only after 2001"],"answer":1,"explain":"Kosovo contains several distinct Sufi orders and communities."},"sources":["S7","S8"]},{"id":"halvetiyye-origins","path":"Halvetiyye","title":"Ömer el-Halveti and Yahya Shirvani","minutes":18,"modes":["travel","focus"],"summary":"Meet the eponymous founder and the major systematiser of Halvetiyye.","body":"Halvetiyye is attributed to Ömer el-Halveti, who died in 1397–1398. The order’s major expansion is associated with Seyyid Yahya-yı Shirvani, often described as a second founder because his writings and deputies created the network from which later branches developed.","terms":["Ömer el-Halveti","Yahya Shirvani","Halvetiyye"],"check":{"q":"Why is Yahya Shirvani sometimes called a second founder?","options":["He built Saraçhane","He systematised and spread the order","He created Ramazaniyye"],"answer":1,"explain":"His writings and deputies shaped the wider Halveti network."},"sources":["S9","S10"]},{"id":"halvetiyye-branches","path":"Halvetiyye","title":"The Halveti family of branches","minutes":15,"modes":["travel","focus"],"summary":"Halvetiyye is a family of branches, not one uniform ritual system.","body":"Major Halveti lines include Rüşeniyye, Cemaliyye, Ahmediyye and Şemsiyye, followed by many further branches. Shared ancestry does not mean identical dhikr, music, clothing, retreat discipline or succession rules.","terms":["Rüşeniyye","Cemaliyye","Ahmediyye"],"check":{"q":"Do all Halveti branches practise identically?","options":["Yes","No","Only in Kosovo"],"answer":1,"explain":"Branches share lineage but may differ substantially in practice and organisation."},"sources":["S9"]},{"id":"halvet-history","path":"Halvetiyye","title":"The meaning of halvet","minutes":14,"modes":["quick","travel"],"summary":"Learn the historical and spiritual meaning of supervised seclusion.","body":"Halvet means seclusion for worship and spiritual discipline. It became important in Halveti identity and training. Historical accounts may describe retreat duration, fasting or recitations, but learning the history is different from receiving a personal retreat programme.","terms":["halvet","khalwa","seyr-u suluk"],"check":{"q":"What can this app teach about halvet?","options":["Its history and meaning","A personal retreat assignment","A claim that everyone must do it"],"answer":0,"explain":"The app teaches the history, purpose and context of halvet."},"sources":["S11"]},{"id":"ahmediyye","path":"Ramazaniyye","title":"The Ahmediyye branch","minutes":16,"modes":["travel","focus"],"summary":"Trace the branch through Yiğitbaşı Ahmed Şemseddin Marmaravi.","body":"Ahmediyye is attributed to Yiğitbaşı Ahmed Şemseddin Marmaravi, who died in 1504. Historical sources associate the branch with a more elaborate pedagogical system of divine names. This belongs in intellectual history; it is not an instruction to adopt a personal litany.","terms":["Ahmediyye","Yiğitbaşı Ahmed","divine names"],"check":{"q":"Where does Ramazaniyye sit?","options":["Outside Halvetiyye","Within the Ahmediyye branch of Halvetiyye","Inside Qadiriyya"],"answer":1,"explain":"The secure branch sequence is Halvetiyye → Ahmediyye → Ramazaniyye."},"sources":["S12"]},{"id":"ramazan-mahfi","path":"Ramazaniyye","title":"Ramazan Mahfi Efendi","minutes":17,"modes":["travel","focus"],"summary":"Study the founder after whom Ramazaniyye is named.","body":"Ramazan Mahfi Efendi was born in Sandıklı in 1542, taught in Istanbul and died in 1616. He was connected through Kasım Larendevi and Muhyiddin Karahisari. His branch developed through a network of deputies and lodges.","terms":["Ramazan Mahfi","Ramazaniyye","Istanbul"],"check":{"q":"When did Ramazan Mahfi live?","options":["1542–1616","1397–1450","1713–1835"],"answer":0,"explain":"The standard biographical dates are 1542–1616."},"sources":["S13"]},{"id":"five-branches","path":"Ramazaniyye","title":"The five Ramazani branches","minutes":14,"modes":["quick","travel"],"summary":"Learn Cihangiriyye, Buhuriyye, Hayatiyye, Raufiyye and Cerrahiyye.","body":"Ramazaniyye developed five named branches through Ramazan Mahfi’s deputies: Cihangiriyye, Buhuriyye, Hayatiyye, Raufiyye and Cerrahiyye. Saraçhane is connected in regional literature with the Ramazani-Hayati environment, but the exact chain requires authorised documentary confirmation.","terms":["Hayatiyye","Cerrahiyye","Ramazaniyye"],"check":{"q":"Which is one of the five Ramazani branches?","options":["Hayatiyye","Mevleviyye","Naqshbandiyye"],"answer":0,"explain":"Hayatiyye is one of the five named Ramazani branches."},"sources":["S13","S14"]},{"id":"branch-sequence","path":"Ramazaniyye","title":"The secure branch sequence","minutes":10,"modes":["quick","travel"],"summary":"Memorise the documented upper branch relationship.","body":"The strongest secure sequence is Halvetiyye → Ahmediyye → Ramazaniyye. The later Balkan transmission toward Osman Baba is partly reconstructed from regional literature and should remain provisional until an authorised silsilaname or ijazet is examined.","terms":["silsila","ijazet","provisional lineage"],"check":{"q":"Which sequence is secure?","options":["Halvetiyye → Ahmediyye → Ramazaniyye","Halvetiyye → Mevleviyye → Ramazaniyye","Qadiriyya → Ramazaniyye"],"answer":0,"explain":"This is the documented upper branch sequence."},"sources":["S9","S12","S13"]},{"id":"sarachane-names","path":"Saraçhane","title":"Names of the teqe","minutes":10,"modes":["quick","travel"],"summary":"Recognise the Albanian, Turkish and historical names used for the institution.","body":"Documented names include Teqja e Saraçhanës, Teqja Halveti, Teqja e Halvetive, Saraçhane Tekkesi, Osman Baba Tekkesi and Asitane-i Halvetijje Ramazanijje. Different names emphasise location, founder, order or institutional status.","terms":["Teqja e Saraçhanës","Osman Baba Tekkesi","asitane"],"check":{"q":"What does the name Saraçhane refer to?","options":["The neighbourhood","A Sufi rank","A book"],"answer":0,"explain":"Saraçhane is the historic quarter in Prizren where the teqe stands."},"sources":["S15","S16"]},{"id":"osman-baba","path":"Saraçhane","title":"Osman Baba","minutes":18,"modes":["travel","focus"],"summary":"Separate documented biography from oral tradition.","body":"The Kosovo heritage record associates the teqe with Shejh Osman Baba, said to have come from Vlesha near Peshkopi, studied in Serres and later served at the Kukli Bey Mosque in Prizren. A story about receiving a house after helping recover a missing child is explicitly preserved as oral tradition, not independently verified archival history.","terms":["Osman Baba","Vlesha","oral tradition"],"check":{"q":"How should the missing-child story be classified?","options":["Proven archive fact","Oral tradition","Modern law"],"answer":1,"explain":"The heritage record itself presents it as oral tradition."},"sources":["S15","S17"]},{"id":"foundation-dates","path":"Saraçhane","title":"Why the foundation dates disagree","minutes":22,"modes":["focus"],"summary":"Compare 1712, 1713, earlier claims and the 1835 repair.","body":"Saraçhane officially gives 1713. Regional scholarship frequently gives 1712. Kosovo’s heritage record lists several earlier possibilities and says the surviving building is associated with a major 1835 repair. These dates may refer to different events, but the exact explanation remains unresolved.","terms":["1712","1713","1835"],"check":{"q":"What does 1835 most securely refer to?","options":["Ramazan Mahfi’s birth","A major repair or reconstruction","The current sheikh’s appointment"],"answer":1,"explain":"The heritage record associates 1835 with the major repair of the surviving building."},"sources":["S15","S17","S18"]},{"id":"asitane","path":"Saraçhane","title":"What asitane means","minutes":13,"modes":["quick","travel"],"summary":"Understand mother-lodge status without assuming universal legal control.","body":"Asitane can mean a principal or mother lodge. Saraçhane publicly describes itself as the mother seat of the Halveti-Ramazani tradition. The title alone does not prove legal ownership or present administrative control over every connected teqe.","terms":["asitane","mother lodge","authority"],"check":{"q":"What does asitane not automatically prove?","options":["Historical seniority","Legal ownership of every connected teqe","A principal-lodge identity"],"answer":1,"explain":"Legal and administrative relationships require separate evidence."},"sources":["S16","S18"]},{"id":"rahovec","path":"Saraçhane","title":"Rahovec and connected teqes","minutes":18,"modes":["travel","focus"],"summary":"Study the best-documented related Halveti centre.","body":"The Great Halveti Teqe of Rahovec is dated by Kosovo’s heritage database to 1732 and associated with Shejh Sylejman Baba Rahoveci. Regional literature connects Sylejman Baba with Osman Baba. The relationship is plausible but should ideally be confirmed through a silsila, ijazet or early lodge record.","terms":["Rahovec","Sylejman Baba","connected teqe"],"check":{"q":"When is the Rahovec teqe dated in the heritage database?","options":["1732","1616","2001"],"answer":0,"explain":"The heritage record dates it to 1145 AH/1732."},"sources":["S19","S18"]},{"id":"architecture","path":"Saraçhane","title":"Architecture and spaces","minutes":18,"modes":["travel","focus"],"summary":"Read the teqe as a complex of ritual, residential, funerary and communal spaces.","body":"The official heritage record describes rooms, a semahane, a türbe, a cobbled courtyard, marble water points, a residence and service buildings. Other studies mention meydan, zikirhane, halvethane and waiting areas. Terminology varies, so measured plans and local explanation are important.","terms":["semahane","türbe","meydan"],"check":{"q":"Which space is associated with burial memory?","options":["Türbe","Waqf","Silsila"],"answer":0,"explain":"A türbe is a mausoleum or tomb structure."},"sources":["S15","S17","S20"]},{"id":"material-culture","path":"Saraçhane","title":"Calligraphy and material culture","minutes":19,"modes":["travel","focus"],"summary":"Study visible objects while separating observation from interpretation.","body":"Art-historical studies discuss fountains, mirrored calligraphy, sword and serpent motifs, a wooden mihrab, calligraphic panels, a sheikh’s seat, skins, horns and a dragon-shaped water spout. An object’s physical description is different from its art-historical or community interpretation.","terms":["calligraphy","mihrab","material culture"],"check":{"q":"What should an app separate?","options":["Observation and interpretation","All dates from all sources","Every Halveti branch"],"answer":0,"explain":"Visible features, inscriptions and interpretations should be labelled separately."},"sources":["S17","S20"]},{"id":"manuscripts","path":"Saraçhane","title":"Manuscripts and berats","minutes":15,"modes":["travel","focus"],"summary":"Understand why reported archival holdings may be crucial to unresolved history.","body":"A regional study reports that Saraçhane possesses manuscripts and berats, but no public item-level catalogue was located. Such materials may contain the strongest evidence for the founder’s teacher, succession, connected teqes and historical authority.","terms":["manuscript","berat","archive"],"check":{"q":"Can the app invent manuscript titles?","options":["Yes","No","Only in dark mode"],"answer":1,"explain":"Without a catalogue, titles and shelf marks must not be invented."},"sources":["S17"]},{"id":"succession","path":"Saraçhane","title":"Succession of sheikhs","minutes":22,"modes":["focus"],"summary":"Study the strongest provisional list without fabricating exact tenures.","body":"Published lists broadly include Osman, Ahmed, Sinan, Cemali, Şihabuddin, Alauddin, Hüseyin, Hasan, Necati and Abidin. Expanded lists add Hüseyin b. Sinan and vary in spelling and dates. The sequence is useful, but an authorised register is needed for a definitive chronology.","terms":["succession","postnişin","confidence"],"check":{"q":"How should the succession list be presented?","options":["As fully proven","As a provisional working list","As fiction"],"answer":1,"explain":"The list is reconstructed from regional sources and contains unresolved variations."},"sources":["S17","S18"]},{"id":"current-sheikh","path":"Saraçhane","title":"Shejh Abidin Shehu","minutes":10,"modes":["quick","travel"],"summary":"Learn the latest verified current leadership information.","body":"Shejh Abidin Shehu’s public biography states that he assumed leadership on 14 December 2001. Official teqe activity continued to identify him with the institution through 26 June 2026. Time-sensitive records should always include the date through which they were verified.","terms":["Abidin Shehu","postnişin","verified through"],"check":{"q":"When did his public biography say he assumed leadership?","options":["14 December 2001","1 January 1713","26 June 2026"],"answer":0,"explain":"His public biography gives 14 December 2001."},"sources":["S16","S21"]},{"id":"roles","path":"Community & Practice","title":"Myhyb, dervish, halife and sheikh","minutes":18,"modes":["travel","focus"],"summary":"Learn why these terms are not a simple rank ladder.","body":"Myhyb or muhib refers to an attached devotee or affiliate. Dervish refers to a committed practitioner or recognised member. Halife normally indicates authorised representation. Sheikh refers to an authorised guide or lodge leader, though it can also be an honorific. Saraçhane publicly addresses myhybs, dervishes and sheikhs as distinct categories.","terms":["myhyb","dervish","halife","sheikh"],"check":{"q":"Which term most clearly implies delegated authorisation?","options":["Visitor","Halife","Myhyb"],"answer":1,"explain":"Halife generally means an authorised deputy or representative."},"sources":["S16","S21"]},{"id":"other-roles","path":"Community & Practice","title":"Murid, zakir, rehber, baba, pir and postnişin","minutes":17,"modes":["travel","focus"],"summary":"Distinguish relationship, function, honorific and office.","body":"Murid means a seeker or disciple. Zakir is a reciter or liturgical-musical function in some contexts. Rehber means guide or delegated mentor. Baba is an honorific meaning father and may indicate leadership in some communities. Pir refers to an ancestral founder or great master. Postnişin is the holder of a lodge’s spiritual seat.","terms":["murid","zakir","rehber","baba","pir","postnişin"],"check":{"q":"Which term means holder of the lodge’s seat?","options":["Postnişin","Myhyb","Zakir"],"answer":0,"explain":"Postnişin is the person occupying the lodge’s spiritual seat."},"sources":["S1","S16"]},{"id":"dhikr","path":"Community & Practice","title":"Public and private dhikr","minutes":18,"modes":["travel","focus"],"summary":"Learn how dhikr can be taught historically without pretending every form is public or identical.","body":"Dhikr means remembrance of God and may be individual or collective, silent or vocal, sitting or standing. Halveti branches vary in sequence, movement, music and recitations. Public information confirms collective dhikr at Saraçhane, but does not establish every current word, count or movement for app instruction.","terms":["dhikr","collective dhikr","devran"],"check":{"q":"Why can’t one Halveti video define Saraçhane’s practice?","options":["All branches differ in every belief","Branch and local forms can vary","Videos are always false"],"answer":1,"explain":"Shared Halveti ancestry does not guarantee identical local ritual forms."},"sources":["S9","S17"]},{"id":"awrad","path":"Community & Practice","title":"Wird and awrad","minutes":14,"modes":["quick","travel"],"summary":"Understand regular recitations and why some are public while others are assigned.","body":"A wird is a regular recitation; awrad is its plural. Some texts are widely public, while others may be assigned by a guide according to a tariqa’s method. The app can explain their function, history and terminology without claiming that one sequence is personally assigned to the learner.","terms":["wird","awrad","assignment"],"check":{"q":"Can awrad vary by tariqa or person?","options":["Yes","No","Only by country"],"answer":0,"explain":"Awrad may vary by order, branch, teacher and personal assignment."},"sources":["S1","S9"]},{"id":"bayah","path":"Community & Practice","title":"Bay‘a and formal commitment","minutes":15,"modes":["travel","focus"],"summary":"Learn the meaning and responsibilities of a formal pledge.","body":"Bay‘a is a formal pledge of commitment to guidance. Procedures and responsibilities vary between tariqas. Family belonging or affection for a teqe does not automatically equal formal bay‘a. The concept can be studied fully even though an app cannot perform or certify it.","terms":["bay‘a","murid","commitment"],"check":{"q":"Can an app perform a valid bay‘a?","options":["Yes","No","Only offline"],"answer":1,"explain":"Bay‘a is a living relationship and formal commitment, not a software action."},"sources":["S1"]},{"id":"seyr-suluk","path":"Community & Practice","title":"Seyr-u suluk and spiritual training","minutes":17,"modes":["focus"],"summary":"Learn how structured formation combines worship, discipline, service and guidance.","body":"Seyr-u suluk refers to guided spiritual formation or progression. It may include ethical discipline, dhikr, service, companionship and stages of self-examination. Historical descriptions vary by order. Learning its structure does not mean claiming a rank or receiving an authorisation.","terms":["seyr-u suluk","maqam","guidance"],"check":{"q":"What is seyr-u suluk?","options":["A building","Guided spiritual formation","A Sufi song"],"answer":1,"explain":"It refers to structured spiritual training or progression."},"sources":["S1","S9"]},{"id":"night-worship","path":"Community & Practice","title":"Night worship and sleep","minutes":12,"modes":["quick","travel"],"summary":"Understand historical ascetic practice without confusing it with chronic sleep deprivation.","body":"Sufi literature often praises voluntary night worship and disciplined wakefulness. This does not mean that Sufism commands people to stop sleeping. Historical ascetic examples must be read alongside moderation, health, responsibilities and the Prophetic warning against unsustainable excess.","terms":["tahajjud","qiyam al-layl","moderation"],"check":{"q":"Does Sufism require chronic sleep deprivation?","options":["Yes","No","Only for beginners"],"answer":1,"explain":"Night worship is voluntary; chronic sleep deprivation is not a general requirement."},"sources":["S3"]},{"id":"breath-movement","path":"Community & Practice","title":"Breath, voice and movement in dhikr","minutes":14,"modes":["travel","focus"],"summary":"Learn why bodily technique varies and must not be generalised from unrelated groups.","body":"Collective dhikr can involve coordinated voice, posture, rhythm, breathing and movement. These features vary greatly across orders and branches. The topic belongs in Sufi history and ritual studies, but Saraçhane’s exact current method should be learned from its authorised community rather than reconstructed from unrelated videos.","terms":["breath","rhythm","movement"],"check":{"q":"Why should the app avoid prescribing an exact breathing pattern?","options":["Breathing is forbidden","The exact local method is not publicly documented and varies","All dhikr is silent"],"answer":1,"explain":"The app can explain the role of breath and rhythm without inventing a Saraçhane regimen."},"sources":["S9","S17"]},{"id":"sohbet-khidma","path":"Community & Practice","title":"Sohbet, adab and khidma","minutes":13,"modes":["quick","travel"],"summary":"See how companionship, conduct and service shape a Sufi community.","body":"Sohbet is formative companionship or instructive conversation. Adab is disciplined and reverent conduct. Khidma is service to people and the community. These may be less visually dramatic than ritual, but they are central to character formation.","terms":["sohbet","adab","khidma"],"check":{"q":"Which term means service?","options":["Khidma","Fana","Silsila"],"answer":0,"explain":"Khidma means service."},"sources":["S1","S3"]},{"id":"ilahis","path":"Community & Practice","title":"Salawat, ilahis and Prizren’s Sufi music","minutes":16,"modes":["travel","focus"],"summary":"Study devotional sound without assigning every local song to Saraçhane.","body":"Salawat are blessings upon the Prophet. Ilahis are devotional hymns found across Ottoman and Balkan Sufi cultures. Prizren has a rich multi-tariqa musical environment, but each song’s community, occasion, language and provenance should be identified before calling it part of Saraçhane’s authorised repertoire.","terms":["salawat","ilahi","provenance"],"check":{"q":"Can every Prizren ilahi be labelled Saraçhane repertoire?","options":["Yes","No","Only if Turkish"],"answer":1,"explain":"Prizren’s Sufi music belongs to several communities and contexts."},"sources":["S8"]},{"id":"ashura","path":"Community & Practice","title":"Muharram and Ashura at Saraçhane","minutes":14,"modes":["travel","focus"],"summary":"Learn what current public evidence establishes—and what it does not.","body":"Official posts document Ashura activity in June 2026 and address myhybs, dervishes and sheikhs. This confirms an important public communal occasion. It does not by itself reveal every internal recitation, programme element or theological explanation.","terms":["Muharram","Ashura","public evidence"],"check":{"q":"What does the public evidence establish?","options":["The event took place","Every private ritual detail","A fixed programme for all future years"],"answer":0,"explain":"Official posts establish the event, not every internal detail."},"sources":["S21"]},{"id":"turbe","path":"Community & Practice","title":"The türbe and burial memory","minutes":13,"modes":["quick","travel"],"summary":"Understand the historical role of the türbe and why visitor etiquette is locally defined.","body":"The Saraçhane complex includes a türbe where leaders are buried. Türbes preserve institutional memory, lineage and local devotion. Opening hours, photography, recitations and access rules should be confirmed with the hosts rather than assumed from another shrine.","terms":["türbe","burial memory","etiquette"],"check":{"q":"What is a türbe?","options":["A mausoleum or tomb structure","A branch of Halvetiyye","A book"],"answer":0,"explain":"Türbe refers to a tomb or mausoleum structure."},"sources":["S15"]},{"id":"yugoslav-postwar","path":"Saraçhane","title":"Yugoslav and postwar history","minutes":18,"modes":["focus"],"summary":"Recognise a major research gap in the institution’s modern history.","body":"Leadership continuity through Hasan, Necati and Abidin shows that the institution survived Yugoslav and post-Yugoslav periods. The heritage record notes restoration after 1999. Detailed evidence about restrictions, property administration, war damage, migration and archive loss remains incomplete.","terms":["Yugoslav period","1999","restoration"],"check":{"q":"Is the modern chronology fully documented?","options":["Yes","No","Only before 1713"],"answer":1,"explain":"The available sources leave major gaps in the twentieth-century and postwar story."},"sources":["S15","S17"]},{"id":"source-types","path":"Research Skills","title":"How to compare source types","minutes":17,"modes":["travel","focus"],"summary":"Learn when official, academic, heritage and community sources are strongest.","body":"An official teqe page is strong evidence for present self-description. A heritage record may be strongest on architecture and legal protection. An academic article may compare earlier sources critically. Community memory preserves meanings that archives may miss. No category is automatically best for every question.","terms":["primary source","heritage record","academic source"],"check":{"q":"Which source is strongest for current institutional self-description?","options":["Official teqe material","A random travel blog","An unrelated poem"],"answer":0,"explain":"Official material is strongest for how the institution currently describes itself."},"sources":["S15","S16","S17"]},{"id":"confidence-labels","path":"Research Skills","title":"Confirmed, reported, disputed and unverified","minutes":12,"modes":["quick","travel"],"summary":"Use evidence labels to avoid flattening disagreements.","body":"A claim may be supported by multiple reliable sources, reported by the teqe, recorded by a heritage institution, interpreted by an academic, preserved as community tradition, disputed or unverified. These labels help the learner understand what kind of knowledge is being presented.","terms":["confirmed","reported","disputed","unverified"],"check":{"q":"How should 1713 be labelled?","options":["Reported by the teqe and heritage record","Impossible","A private ritual"],"answer":0,"explain":"1713 is the official institutional date and appears in the heritage record, while other dates remain in circulation."},"sources":["S15","S16"]},{"id":"open-questions","path":"Research Skills","title":"The major open questions","minutes":16,"modes":["focus"],"summary":"Know what remains genuinely unresolved about Saraçhane.","body":"Open questions include the earliest contemporary document, the event behind each foundation date, Osman Baba’s exact authorising chain, the definitive succession list, the scope of asitane authority, surviving manuscripts and the full modern history. A strong learner knows what is unresolved instead of pretending every gap has been filled.","terms":["open question","silsilaname","succession"],"check":{"q":"What should happen when evidence is missing?","options":["Invent an answer","Label the question unresolved","Copy social media rumours"],"answer":1,"explain":"Unresolved questions should remain visible until evidence is found."},"sources":["S15","S17"]}],"sources":[{"id":"S1","title":"Carl W. Ernst, Sufism: An Introduction to the Mystical Tradition of Islam","type":"Book","note":"Accessible historical and conceptual introduction."},{"id":"S2","title":"Alexander Knysh, Sufism: A New History of Islamic Mysticism","type":"Book","note":"Modern study of institutions, authority and diversity."},{"id":"S3","title":"Al-Ghazali, The Beginning of Guidance","type":"Classical text","note":"Practical ethics and disciplined conduct."},{"id":"S4","title":"Al-Qushayri, Epistle on Sufism","type":"Classical manual","note":"Classical terminology, biographies and spiritual states."},{"id":"S5","title":"Ahmet T. Karamustafa, Sufism: The Formative Period","type":"Academic book","note":"Strong treatment of early formation."},{"id":"S6","title":"J. Spencer Trimingham, The Sufi Orders in Islam","type":"Academic book","note":"Classic institutional survey; some models are dated."},{"id":"S7","title":"Nathalie Clayer, Mystiques, État et société","type":"Academic book","note":"Major study of Balkan Halveti institutions; French."},{"id":"S8","title":"Balkanlarda Tasavvuf documentary series","type":"Documentary","note":"Episodes on Prizren, Sufi music and Halveti communities."},{"id":"S9","title":"TDV İslâm Ansiklopedisi: Halvetiyye","type":"Academic reference","note":"Origins, branches and general Halveti history."},{"id":"S10","title":"TDV: Ömer el-Halvetî / Yahyâ-yı Şirvânî","type":"Academic reference","note":"Biographical foundations of Halvetiyye."},{"id":"S11","title":"TDV: Halvet","type":"Academic reference","note":"Historical explanation of supervised seclusion."},{"id":"S12","title":"TDV: Ahmediyye / Yiğitbaşı Ahmed Şemseddin","type":"Academic reference","note":"Ahmediyye branch and pedagogical history."},{"id":"S13","title":"TDV: Ramazan Efendi Mahfi / Ramazaniyye","type":"Academic reference","note":"Founder, dates and five Ramazani branches."},{"id":"S14","title":"Regional studies of Kosovo and Macedonia Halvetism","type":"Academic regional study","note":"Useful for Balkan transmission; chronology must be checked."},{"id":"S15","title":"Kosovo Cultural Heritage Database: Teqja Halveti","type":"Official heritage","note":"Architecture, founder narrative, foundation alternatives and 1835 repair."},{"id":"S16","title":"Official Saraçhane / Halveti Kosovo public material","type":"Institutional source","note":"Current self-description, asitane identity and public events."},{"id":"S17","title":"Adem Efe, Saraçhane conference paper","type":"Academic paper","note":"Founder, dates, succession, manuscripts and architecture."},{"id":"S18","title":"Regional historical surveys of Saraçhane","type":"Regional scholarship","note":"1712 date, succession and connected lodges; verify original evidence."},{"id":"S19","title":"Kosovo Heritage Database: Great Halveti Teqe of Rahovec","type":"Official heritage","note":"1732 date, founder, architecture and objects."},{"id":"S20","title":"Yunus Berkli, Osman Baba Tekke art-history study","type":"Academic article","note":"Detailed material culture and symbolic interpretation."},{"id":"S21","title":"Official Saraçhane public activity, verified through 26 June 2026","type":"Current institutional evidence","note":"Current leadership and Ashura activity."}],"books":[{"title":"The Beginning of Guidance","author":"Abu Hamid al-Ghazali","level":"Beginner","language":"English or German","type":"Classical ethics","why":"The best starting point for adab, worship, time, conduct and avoiding destructive habits.","plan":"Read the introduction, then one short section at a time. Pair it with the app’s Foundations path.","extract":"Paraphrased extract: knowledge matters when it changes how a person worships, behaves and uses time.","limits":"Not a Halveti or Saraçhane manual; some advice reflects its historical setting."},{"title":"Sufism: An Introduction to the Mystical Tradition of Islam","author":"Carl W. Ernst","level":"Beginner–Intermediate","language":"English","type":"Academic overview","why":"A clear first historical overview that avoids reducing Sufism to poetry or exotic mysticism.","plan":"Read alongside the History path, especially the chapters on origins, institutions and practice.","extract":"Paraphrased extract: Sufism is best understood through its changing communities, texts, practices and institutions.","limits":"Not focused on Kosovo or Halvetiyye."},{"title":"Sufism: A New History of Islamic Mysticism","author":"Alexander Knysh","level":"Intermediate","language":"English","type":"Modern academic history","why":"Excellent on authority, institutions, diversity and the problems of defining Sufism.","plan":"Read after Ernst. Use it when the app discusses tariqas, authority and modern change.","extract":"Paraphrased extract: there has never been only one timeless form of Sufism; context and institutions matter.","limits":"Dense and not devotional."},{"title":"Sufism: The Formative Period","author":"Ahmet T. Karamustafa","level":"Intermediate–Advanced","language":"English","type":"Early history","why":"Strongest choice for the early development before the mature Ottoman tariqa world.","plan":"Read selected chapters after the Early History lessons.","extract":"Paraphrased extract: early renunciation, piety and mystical teaching developed before later organised orders.","limits":"Stops before the Ottoman-Balkan period."},{"title":"Mystical Dimensions of Islam","author":"Annemarie Schimmel","level":"Intermediate","language":"English; German original also useful","type":"Literary and historical synthesis","why":"Rich overview of symbolism, poetry, personalities and devotional culture.","plan":"Use as a reference rather than reading straight through at first.","extract":"Paraphrased extract: Sufi language uses poetry and symbol to express love, longing and transformation.","limits":"Older scholarly framework; pair with Knysh or Ernst."},{"title":"The Sufi Orders in Islam","author":"J. Spencer Trimingham","level":"Intermediate","language":"English","type":"Institutional history","why":"Useful comparative vocabulary for orders, lodges, succession and organisation.","plan":"Consult chapters relevant to tariqas and lodges after the Formation lesson.","extract":"Paraphrased extract: Sufi orders developed through masters, methods, chains, lodges and regional networks.","limits":"Its evolutionary model is dated."},{"title":"Al-Qushayri’s Epistle on Sufism","author":"Al-Qushayri; trans. Alexander Knysh","level":"Intermediate–Advanced","language":"English","type":"Classical manual","why":"A major classical source for terms, spiritual states, ethics and early biographies.","plan":"Use after finishing the Foundations path; read selected entries rather than all at once.","extract":"Paraphrased extract: spiritual vocabulary must be grounded in discipline, sincerity and transmitted teaching.","limits":"Large, dense and not branch-specific."},{"title":"Mystiques, État et société","author":"Nathalie Clayer","level":"Advanced","language":"French","type":"Balkan Halveti history","why":"One of the most important broad studies of Halveti institutions in southeastern Europe.","plan":"Use later for serious Balkan research and consult translations or summaries if needed.","extract":"Paraphrased extract: Balkan Sufi institutions developed through changing relationships with society, state and local networks.","limits":"French, academic and often difficult to obtain."},{"title":"Balkanlar’da Tasavvuf","author":"Metin İzeti","level":"Intermediate","language":"Turkish","type":"Regional synthesis","why":"Useful regional orientation for Sufism in the Balkans.","plan":"Read alongside the Kosovo and Prizren lessons.","extract":"Paraphrased extract: Balkan Sufi life must be studied through local institutions, languages and historical change.","limits":"Cross-check individual claims with primary and academic sources."}],"glossary":{"tasawwuf":"Islamic traditions of spiritual discipline, character formation and experiential knowledge.","ihsan":"Worshipping with consciousness of God’s presence and observation.","tazkiya":"Purification and growth of the self through repentance, worship and virtue.","nafs":"The self as the site of appetite, ego, struggle and purification.","qalb":"The heart as centre of intention and spiritual receptivity.","ruh":"Spirit; its full reality is not reducible to psychology.","tariqa":"An organised Sufi path with teaching, lineage, methods and community.","silsila":"A chain of transmission connecting authorised teachers.","bay‘a":"A formal pledge of commitment to guidance.","murid":"A seeker or disciple under guidance.","myhyb":"Local form of muhib: an attached devotee or affiliate.","dervish":"A committed practitioner or recognised member; local requirements vary.","halife":"An authorised deputy or representative.","sheikh":"An authorised spiritual guide or lodge leader; sometimes also an honorific.","pir":"An ancestral founder or great master.","baba":"An honorific meaning father; its institutional meaning varies.","postnişin":"Holder of a lodge’s spiritual seat.","zakir":"A reciter or liturgical-musical function in some Sufi settings.","rehber":"A guide or delegated mentor; local usage varies.","adab":"Disciplined, reverent and appropriate conduct.","sohbet":"Formative companionship or instructive conversation.","khidma":"Service to people and community.","dhikr":"Remembrance of God, individually or collectively.","wird":"A regular recitation; plural awrad.","halvet":"Supervised seclusion or retreat for worship.","seyr-u suluk":"Guided spiritual formation or progression.","fana":"Passing of self-assertion in orientation to God, not becoming divine.","baqa":"Stable and responsible servanthood after fana.","ma‘rifa":"Realised spiritual recognition.","asitane":"A principal or mother lodge.","teqe":"A Sufi lodge; Albanian form of tekke.","semahane":"A hall associated with prayer or ceremony.","meydan":"A ceremonial or gathering space; local usage varies.","türbe":"A mausoleum or tomb structure.","berat":"An official decree or document of appointment or privilege in Ottoman contexts.","ilahi":"A devotional hymn.","salawat":"Blessings invoked upon the Prophet Muhammad.","tahajjud":"Voluntary night prayer.","awrad":"Plural of wird; regular recitations, some public and some assigned."}};const KEY='sarachhane-study-v3';let state={completed:[],saved:[],review:[],lastLesson:null,lastMode:'all',sessions:0,lastStudied:null,lastSaved:null};let speech=null;
function load(){try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}function save(){state.lastSaved=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function lesson(id){return DATA.lessons.find(x=>x.id===id)}function pct(){return Math.round(state.completed.length/DATA.lessons.length*100)}function row(x){let done=state.completed.includes(x.id);return `<button class="lessonrow ${done?'done':''}" onclick="openLesson('${x.id}')"><span class="mark">${done?'✓':x.path.slice(0,2).toUpperCase()}</span><span><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></span><span class="time">${x.minutes}m</span></button>`}
function renderHome(){let current=lesson(state.lastLesson)||DATA.lessons.find(x=>!state.completed.includes(x.id))||DATA.lessons[0];let filtered=DATA.lessons.filter(x=>state.lastMode==='all'||x.modes.includes(state.lastMode)).filter(x=>!state.completed.includes(x.id)).slice(0,5);home.innerHTML=`<div class="hero"><div class="eyebrow">Private self-paced study</div><h2>Learn Sufism through your tradition.</h2><p class="lede">A sourced course on tasawwuf, Halvetiyye–Ramazaniyye and Teqja e Saraçhanës. No weekly schedule, personal diary or family assignments.</p><div class="continue"><div><div class="eyebrow">Continue learning</div><h3>${esc(current.title)}</h3><p class="notice">${esc(current.path)} · ${current.minutes} min</p></div><button class="btn" onclick="openLesson('${current.id}')">Continue</button></div></div><div class="metrics"><div class="metric"><b>${state.completed.length}</b>lessons</div><div class="metric"><b>${pct()}%</b>complete</div><div class="metric"><b>${state.review.length}</b>to review</div></div><div class="progressline" aria-label="${pct()} percent complete"><span style="width:${pct()}%"></span></div><div class="sectionhead"><h3>Choose your time</h3></div><div class="modes">${[['all','Any time'],['quick','5–10 min'],['travel','Bus / walk'],['focus','Focused']].map(([k,l])=>`<button class="mode ${state.lastMode===k?'active':''}" onclick="setMode('${k}')"><b>${l}</b><br><span class="notice">${k==='all'?'Show everything':k==='quick'?'Short lessons':k==='travel'?'Listen or read':'Longer study'}</span></button>`).join('')}</div><div class="sectionhead"><h3>Recommended next</h3></div><div class="list">${filtered.map(row).join('')}</div>`}
function renderRoadmap(){let paths=[...new Set(DATA.lessons.map(x=>x.path))];roadmap.innerHTML=`<div class="eyebrow">Step by step</div><h2>Your learning roadmap</h2><p class="lede">Follow this order for a complete foundation, or open any path whenever you want.</p><div class="roadmap">${paths.map((p,i)=>{let ls=DATA.lessons.filter(x=>x.path===p),done=ls.filter(x=>state.completed.includes(x.id)).length;return `<div class="roadmap-step ${done===ls.length?'done':''}"><div class="eyebrow">Stage ${i+1} · ${done}/${ls.length}</div><h3>${esc(p)}</h3><p>${esc(ls.map(x=>x.title).slice(0,4).join(' · '))}${ls.length>4?'…':''}</p><button class="btn secondary" onclick="showPath('${esc(p)}')">Open stage</button></div>`}).join('')}</div>`}
function renderLessons(filter='',onlyPath=''){let q=filter.toLowerCase(),paths=[...new Set(DATA.lessons.map(x=>x.path))].filter(p=>!onlyPath||p===onlyPath);lessons.innerHTML=`<div class="eyebrow">Course</div><h2>${onlyPath?esc(onlyPath):'All lessons'}</h2><input class="search" aria-label="Search lessons" placeholder="Search lessons and topics" value="${esc(filter)}" oninput="renderLessons(this.value,'${esc(onlyPath)}')">${paths.map(p=>{let ls=DATA.lessons.filter(x=>x.path===p&&(!q||(x.title+' '+x.summary+' '+x.body).toLowerCase().includes(q)));if(!ls.length)return'';return `<div class="path"><h3 class="path-title">${esc(p)}</h3><div class="list">${ls.map(row).join('')}</div></div>`}).join('')}`}
function renderLibrary(){library.innerHTML=`<div class="eyebrow">Reading guide</div><h2>Books and extracts</h2><p class="lede">Recommended reading in a sensible order. The extracts below are paraphrases, not copied chapters.</p>${DATA.books.map((b,i)=>`<article class="book"><div class="bookmeta">${i+1} · ${esc(b.level)} · ${esc(b.language)} · ${esc(b.type)}</div><h3>${esc(b.title)}</h3><p><b>${esc(b.author)}</b></p><p>${esc(b.why)}</p><p><b>How to use it</b><br>${esc(b.plan)}</p><div class="extract"><b>Paraphrased extract</b><br>${esc(b.extract.replace('Paraphrased extract: ',''))}</div><p class="notice"><b>Limitation:</b> ${esc(b.limits)}</p></article>`).join('')}<div class="sectionhead"><h3>Research sources</h3></div>${DATA.sources.map(s=>`<div class="source"><small>${esc(s.id)} · ${esc(s.type)}</small><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p></div>`).join('')}`}
function renderGlossary(filter=''){let q=filter.toLowerCase(),entries=Object.entries(DATA.glossary).filter(([k,v])=>!q||(k+' '+v).toLowerCase().includes(q));glossary.innerHTML=`<div class="eyebrow">Terms</div><h2>Glossary</h2><input class="search" placeholder="Search terms" value="${esc(filter)}" oninput="renderGlossary(this.value)"><div class="terms">${entries.map(([k])=>`<button class="termchip" onclick="openTerm('${esc(k)}')">${esc(k)}</button>`).join('')}</div>`}
function openLesson(id){let x=lesson(id);state.lastLesson=id;state.sessions++;state.lastStudied=new Date().toISOString();save();let src=x.sources.map(id=>DATA.sources.find(s=>s.id===id)).filter(Boolean);lessonBody.innerHTML=`<div class="dialogtop"><div><div class="eyebrow">${esc(x.path)} · ${x.minutes} minutes</div><h3>${esc(x.title)}</h3></div><button class="close" aria-label="Close lesson" onclick="closeLesson()">×</button></div><div class="lessoncopy"><p class="lede">${esc(x.summary)}</p><p>${esc(x.body)}</p><div class="terms">${x.terms.map(t=>`<button class="termchip" onclick="openTerm('${esc(t)}')">${esc(t)}</button>`).join('')}</div><div class="quiz"><h3>Check your understanding</h3><p>${esc(x.check.q)}</p>${x.check.options.map((o,i)=>`<button onclick="answerQuiz(this,${i},${x.check.answer},'${esc(x.check.explain)}')">${esc(o)}</button>`).join('')}<p class="notice" id="quizExplain"></p></div><h3>Sources used</h3>${src.map(s=>`<p><b>${esc(s.id)} · ${esc(s.title)}</b><br><span class="notice">${esc(s.note)}</span></p>`).join('')}<div class="lesson-actions"><button class="btn ${state.completed.includes(id)?'secondary':''}" onclick="toggleComplete('${id}')">${state.completed.includes(id)?'Completed ✓':'Mark as understood'}</button><button class="btn secondary" onclick="toggleSaved('${id}')">${state.saved.includes(id)?'Saved ✓':'Save for later'}</button><button class="btn secondary" onclick="toggleReview('${id}')">${state.review.includes(id)?'Review marked ✓':'Mark for review'}</button><button class="btn ghost" onclick="speakLesson('${id}')">Listen</button></div></div>`;lessonDialog.showModal()}
function answerQuiz(btn,i,a,e){btn.parentElement.querySelectorAll('button').forEach((b,j)=>b.classList.toggle(j===a?'correct':'wrong',j===i||j===a));document.getElementById('quizExplain').textContent=(i===a?'Correct. ':'Not quite. ')+e}function closeLesson(){speechSynthesis.cancel();lessonDialog.close();renderAll()}function toggleComplete(id){state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();openLesson(id)}function toggleSaved(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();openLesson(id)}function toggleReview(id){state.review=state.review.includes(id)?state.review.filter(x=>x!==id):[...state.review,id];save();openLesson(id)}function speakLesson(id){speechSynthesis.cancel();let x=lesson(id);speech=new SpeechSynthesisUtterance(`${x.title}. ${x.summary}. ${x.body}. Check your understanding: ${x.check.q}`);speech.lang='en-GB';speech.rate=.92;speechSynthesis.speak(speech)}function openTerm(t){let v=DATA.glossary[t]||'This term needs a fuller glossary entry.';termBody.innerHTML=`<div class="dialogtop"><div><div class="eyebrow">Glossary</div><h3>${esc(t)}</h3></div><button class="close" aria-label="Close glossary" onclick="termDialog.close()">×</button></div><p>${esc(v)}</p>`;termDialog.showModal()}function setMode(m){state.lastMode=m;save();renderHome()}function showPath(p){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));lessons.classList.add('active');document.querySelector('[data-screen="lessons"]').classList.add('active');renderLessons('',p);scrollTo(0,0)}function renderAll(){renderHome();renderRoadmap();renderLessons();renderLibrary();renderGlossary()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');b.classList.add('active');scrollTo(0,0)});load();renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
